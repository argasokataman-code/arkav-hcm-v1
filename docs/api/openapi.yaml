      summary: Create invoice (HCM admin)
      description: |
        Optional `subscription_id` must reference a subscription for the same `company_id`.
        When the invoice is later marked paid, a linked subscription in `pending_payment` becomes `active`
        (paid period starts from payment date; see `SubscriptionActivationFromInvoiceService`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, issue_date, due_date, amount_due]
              properties:
                company_id: { type: string, format: uuid }
                purchase_transaction_id: { type: string, format: uuid, nullable: true }
                subscription_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Same-company subscription; used to auto-activate pending_payment on mark paid
                issue_date: { type: string, format: date }
                due_date: { type: string, format: date }
                amount_due: { type: number, minimum: 0 }
                notes: { type: string, nullable: true }
      responses:
        '201': { description: Created }
