  # -------------------------
  # Attendance (implemented under /v1/hcm)
  # -------------------------
  /v1/hcm/attendance/admin:
    get:
      tags: [Attendance]
      summary: Attendance admin list (admin only, paginated)
      security:
        - bearerAuth: []
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: department, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [present, absent, needs_review] } }
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/hcm/attendance/admin/export:
    get:
      tags: [Attendance]
      summary: Export attendance admin report (admin only)
      security:
        - bearerAuth: []
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [xlsx, csv], default: xlsx } }
        - { name: source, in: query, required: false, schema: { type: string, enum: [live, archive], default: live } }
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: department, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [present, absent, needs_review] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [name_asc, name_desc, checkin_asc, checkin_desc, production_desc, production_asc] } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: snapshotId, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: OK (XLSX/CSV file stream) }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/attendance/admin/record:
    put:
      tags: [Attendance]
      summary: Admin upsert attendance record (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, workDate]
              properties:
                userId:
                  type: integer
                  description: Active contract uses users.id.
                workDate:
                  type: string
                  format: date
                checkInTime:
                  type: string
                  nullable: true
                  pattern: '^\\d{2}:\\d{2}$'
                checkOutTime:
                  type: string
                  nullable: true
                  pattern: '^\\d{2}:\\d{2}$'
                breakMinutes:
                  type: integer
                  minimum: 0
                  maximum: 720
                lateMinutes:
                  type: integer
                  minimum: 0
                  maximum: 1440
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/attendance/admin/corrections:
    get:
      tags: [Attendance]
      summary: List pending employee correction requests (admin)
      description: |
        Feature gate: `hcm.api.feature:attendance`.
        Returns all attendance records with `correction_status = requested`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: perPage
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/hcm/attendance/admin/correction-approve:
    post:
      tags: [Attendance]
      summary: Approve an employee correction request (admin)
      description: 'Feature gate: `hcm.api.feature:attendance`.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordId]
              properties:
                recordId: { type: integer }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/attendance/admin/correction-dismiss:
    post:
      tags: [Attendance]
      summary: Dismiss an employee correction request (admin)
      description: 'Feature gate: `hcm.api.feature:attendance`.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordId]
              properties:
                recordId: { type: integer }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
