      summary: List performance reviews (scope me/team/all)
      security:
        - bearerAuth: []
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [me, team, all] } }
        - { name: cycleId, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, submitted, manager_reviewed, finalized] } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Performance]
      summary: Create performance review (HCM admin)
      description: |
        Kontrak aktif UI mengirim `cycleId`, `userId`, dan `templateId` sebagai numeric `id`.
        UUID masih diterima sebagai fallback legacy. `userId` target wajib anggota tenant aktif,
        dan review baru disimpan dengan `company_id` tenant aktif untuk menjaga tenant isolation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId, userId, templateId]
              properties:
                cycleId:
                  oneOf:
                    - { type: integer, minimum: 1 }
                    - { type: string, format: uuid }
                userId:
                  oneOf:
                    - { type: integer, minimum: 1 }
                    - { type: string, format: uuid }
                  description: Target employee identifier. User must belong to the active company.
                templateId:
                  oneOf:
                    - { type: integer, minimum: 1 }
                    - { type: string, format: uuid }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

