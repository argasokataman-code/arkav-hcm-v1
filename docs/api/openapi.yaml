      description: |
        Kalkulator cepat kompensasi PKWT berdasarkan tanggal mulai/akhir kontrak dan upah bulanan.
        Cocok untuk pengecekan HR sebelum review payroll/off-cycle.
      security:
        - bearerAuth: []
      requestBody:
        required: true
