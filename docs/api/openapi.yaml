  # -------------------------
  # Payroll — salary component master (implemented under /v1/hcm)
  # -------------------------
  /v1/hcm/salary-components:
    get:
      tags: [Payroll]
      summary: List salary components (HCM admin only)
      description: |
        Mengembalikan semua baris master komponen gaji (urut `sortOrder`, `name`).
        Hanya **HCM Admin**; non-admin `403`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentListResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Payroll]
      summary: Create salary component (HCM admin only)
      description: |
        `category` harus sesuai `kind` (lihat enum di schema). `code` opsional; regex `^[a-z0-9_-]+$`, unik.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryComponentCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentCreatedResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/salary-components/{id}:
    get:
      tags: [Payroll]
      summary: Get salary component by id (HCM admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentDetailResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Payroll]
      summary: Update salary component (HCM admin)
      description: |
        - Baris **bukan** `isSystemLocked`: kirim **payload penuh** (`SalaryComponentUpdateFullRequest`).
        - Baris **sistem terkunci** (seed): subset `SalaryComponentUpdateLockedRequest` (termasuk penyesuaian `defaultPercent` / `percentBasis`).
        Catatan: backend mengabaikan field lain pada baris terkunci; pada baris tidak terkunci, payload parsial akan gagal validasi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SalaryComponentUpdateFullRequest'
                - $ref: '#/components/schemas/SalaryComponentUpdateLockedRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentOkResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Payroll]
      summary: Delete salary component (HCM admin)
      description: |
        Baris `isSystemLocked` (seed) tidak dapat dihapus — respons `422` dengan `error.code` = `DOMAIN_LOCKED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentOkResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # -------------------------
  # Payroll — period & run (draft / finalize / self slip lines)
  # -------------------------
  /v1/hcm/payroll-periods:
    get:
      tags: [Payroll]
      summary: List payroll periods (HCM admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        periodYear:
                          type: integer
                          example: 2026
                        periodMonth:
                          type: integer
                          example: 4
                        status:
                          type: string
                          enum: [open, posted]
                          example: open
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/hcm/payroll-periods/active:
    get:
      tags: [Payroll]
      summary: Get active payroll period (HCM admin)
      description: Returns latest `open` period; creates current month period when none exists.
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Payroll]
      summary: Create payroll period (HCM admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodYear, periodMonth]
              properties:
                periodYear: { type: integer, minimum: 2000, maximum: 2100 }
                periodMonth: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      periodYear:
                        type: integer
                        example: 2026
                      periodMonth:
                        type: integer
                        example: 4
                      status:
                        type: string
                        enum: [open, posted]
                        example: open
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Validation error - PAYROLL_PERIOD_EXISTS
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: PAYROLL_PERIOD_EXISTS
                      message:
