          schema: { type: string, enum: [addition, deduction] }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/hcm/payroll-items/export:
    get:
      tags: [Payroll]
      summary: Export payroll items (CSV/XLSX)
      security:
        - bearerAuth: []
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [addition, deduction] } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, xlsx], default: csv } }
      responses:
        '200': { description: File stream (csv/xlsx) }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
