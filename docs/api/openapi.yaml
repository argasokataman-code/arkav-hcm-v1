  /v1/hcm/employees/bulk-upload:
    post:
      tags: [HCM]
      summary: Bulk create/update employees from spreadsheet
      description: |
        All-or-nothing import. Team assignment rows reject inactive team targets,
        both for explicit `team_id` and resolved `team` name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Bulk import applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      createdRows: { type: integer }
                      updatedRows: { type: integer }
                      failedRows: { type: integer }
                      errors:
                        type: array
                        items: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Validation failure; import is rolled back all-or-nothing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                employeeCountExceeded:
                  value:
                    success: false
                    error:
                      code: EMPLOYEE_COUNT_EXCEEDED
                      message: "Cannot add more employees. Current: 10, trying to add: 11, plan limit: 10"
                inactiveTeamAssignment:
                  value:
                    success: false
                    error:
                      code: BULK_UPLOAD_VALIDATION_FAILED
                      message: Bulk upload dibatalkan karena ada baris yang tidak valid. Tidak ada perubahan yang disimpan.

  /v1/hcm/billing/checkout:
    post:
      tags: [SaaS, HCM]
      summary: Tenant subscription checkout (create or reuse invoice)
      description: |
        Creates a new pending subscription + invoice for the active company, or returns an
        existing unpaid invoice with `reused: true` if one already exists.

        **Global dedup guard**: if the company has ANY unpaid invoice (`status` in `draft`/`sent`,
        `is_paid=false`), the endpoint reuses it and returns immediately — no new invoice or
        subscription is created. This prevents double-billing when a user revisits the checkout
        page after payment is already in progress. The client must hide the checkout form and
        prompt the user to pay the existing invoice.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_uuid, billing_cycle]
              properties:
                package_uuid:
                  type: string
                  format: uuid
                billing_cycle:
                  type: string
                  enum: [monthly, yearly]
                billingEmail:
                  type: string
                  format: email
                  nullable: true
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      subscription:
                        type: object
                        properties:
                          id: { type: integer }
                          status: { type: string }
                          billingCycle: { type: string }
                          amount: { type: number }
                          packageId: { type: string, format: uuid }
                          packageCode: { type: string }
                          packageName: { type: string }
                      invoice:
                        type: object
                        properties:
                          id: { type: integer }
                          invoiceNumber: { type: string, nullable: true }
                          issueDate: { type: string, nullable: true }
                          dueDate: { type: string, nullable: true }
                          amountDue: { type: number }
                          isPaid: { type: boolean }
                          status: { type: string }
                      reused: { type: boolean }
        '200':
          description: Reused existing pending invoice
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1hcm~1billing~1checkout/post/responses/201/content/application~1json/schema'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Validation error or tenant context missing (TENANT_CONTEXT_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tenantContextRequired:
                  value:
                    success: false
                    error:
                      code: TENANT_CONTEXT_REQUIRED
                      message: Active company context is required.

  /v1/hcm/billing/addons/checkout:
    post:
      tags: [SaaS, HCM]
      summary: Tenant add-on checkout (create or reuse invoice)
      description: |
        Creates a dedicated add-on purchase transaction and invoice for the active company.
        If an unpaid invoice already exists (`draft`/`sent`, `is_paid=false`), endpoint returns
        that invoice with `reused: true` and does not create a new add-on transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addon_id:
                  type: integer
                addon_uuid:
                  type: string
                  format: uuid
                billingEmail:
                  type: string
                  format: email
                  nullable: true
              anyOf:
                - required: [addon_id]
                - required: [addon_uuid]
      responses:
        '201':
          description: Add-on invoice created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      addon:
                        type: object
                        properties:
                          id: { type: integer }
                          uuid: { type: string, format: uuid }
                          code: { type: string }
                          name: { type: string }
                          pricePerUnit: { type: number }
                          unitName: { type: string }
                      transaction:
                        type: object
                        properties:
                          id: { type: integer }
                          code: { type: string }
                          status: { type: string }
                          amount: { type: number }
                          taxAmount: { type: number }
                          totalAmount: { type: number }
                      invoice:
                        type: object
                        properties:
                          id: { type: integer }
                          invoiceNumber: { type: string, nullable: true }
                          issueDate: { type: string, nullable: true }
                          dueDate: { type: string, nullable: true }
                          amountDue: { type: number }
                          isPaid: { type: boolean }
                          status: { type: string }
                      reused: { type: boolean }
        '200':
          description: Reused existing unpaid invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      invoice:
                        type: object
                        properties:
                          id: { type: integer }
                          invoiceNumber: { type: string, nullable: true }
                          issueDate: { type: string, nullable: true }
                          dueDate: { type: string, nullable: true }
                          amountDue: { type: number }
                          isPaid: { type: boolean }
                          status: { type: string }
                      reused: { type: boolean }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Validation error or tenant context missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

