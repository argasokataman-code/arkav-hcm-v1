  /v1/hcm/payroll-runs/{id}/finalize:
    post:
      tags: [Payroll]
      summary: Finalize draft payroll run (HCM admin)
      description: |
        Menandai run `finalized` dan periode `posted`. `422` dengan `PAYROLL_RUN_EMPTY` jika tidak ada baris;
        `PAYROLL_RUN_NOT_DRAFT` / `PAYROLL_FINALIZED_EXISTS` (hanya jika sudah ada final dengan `purpose` yang sama).
        Saat fitur reconciliation enforcement aktif, endpoint juga dapat mengembalikan
        `EXPORT_RECON_REQUIRED` / `EXPORT_RECON_EXPIRED` / `EXPORT_RECON_SCOPE_MISMATCH` / `EXPORT_RECON_STALE_DATA`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      payrollPeriodId:
                        type: integer
                        example: 1
                      purpose:
                        type: string
                        enum: [monthly, thr]
                        example: monthly
                      status:
                        type: string
                        enum: [draft, finalized]
                        example: finalized
                      calculatedAt:
                        type: string
                        format: date-time
                        nullable: true
                      finalizedAt:
                        type: string
                        format: date-time
                        nullable: true
                      voidedAt:
                        type: string
                        format: date-time
                        nullable: true
                      voidedByUserId:
                        type: integer
                        nullable: true
                      voidedByUserName:
                        type: string
                        nullable: true
                      finalizedByUserId:
                        type: integer
                        nullable: true
                      period:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                          periodYear:
                            type: integer
                          periodMonth:
                            type: integer
                          status:
                            type: string
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422':
          description: Validation/domain error termasuk PAYROLL_RUN_NOT_DRAFT, PAYROLL_FINALIZED_EXISTS, PAYROLL_RUN_EMPTY, EXPORT_RECON_REQUIRED, EXPORT_RECON_EXPIRED, EXPORT_RECON_SCOPE_MISMATCH, EXPORT_RECON_STALE_DATA
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [PAYROLL_RUN_NOT_DRAFT, PAYROLL_FINALIZED_EXISTS, PAYROLL_RUN_EMPTY, EXPORT_RECON_REQUIRED, EXPORT_RECON_EXPIRED, EXPORT_RECON_SCOPE_MISMATCH, EXPORT_RECON_STALE_DATA]
                      message:
                        type: string
