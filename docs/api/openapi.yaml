        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/hcm/payroll-periods/active:
    get:
      tags: [Payroll]
      summary: Get active payroll period (HCM admin)
      description: Returns latest `open` period; creates current month period when none exists.
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Payroll]
      summary: Create payroll period (HCM admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodYear, periodMonth]
              properties:
                periodYear: { type: integer, minimum: 2000, maximum: 2100 }
                periodMonth: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      periodYear:
                        type: integer
                        example: 2026
                      periodMonth:
                        type: integer
                        example: 4
                      status:
                        type: string
                        enum: [open, posted]
                        example: open
                      companyId:
                        type: integer
                        nullable: true
                        example: 12
                      companyName:
                        type: string
                        nullable: true
                        example: ARCAV Demo Tenant
                      companyCode:
                        type: string
                        nullable: true
                        example: DEMO01
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Validation error - PAYROLL_PERIOD_EXISTS
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
