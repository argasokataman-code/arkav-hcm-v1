                            format: float
                            example: 5350000
                      slipNumber:
                        type: string
                        example: SLIP-2026-06-42
                      downloadUrl:
                        type: string
                        nullable: true
                        example: https://example.test/v1/hcm/payroll/my-slip-pdf?periodYear=2026&periodMonth=6
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422':
          description: Validation error - invalid periodYear/periodMonth
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /v1/hcm/payroll/my-slip-pdf:
    get:
      tags: [Payroll]
      summary: Download current user monthly payslip PDF (authenticated)
      description: |
        Query `periodYear`, `periodMonth`. Menghasilkan file PDF slip gaji milik user login.
        Hanya tersedia jika periode tersebut sudah memiliki run payroll `finalized`.
      security:
        - bearerAuth: []
      parameters:
        - name: periodYear
          in: query
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: periodMonth
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: PDF payslip
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404':
          description: Not found - PAYROLL_SLIP_NOT_FOUND
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: PAYROLL_SLIP_NOT_FOUND
                      message:
                        type: string
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/my-slip-lines:
    get:
      tags: [Payroll]
      summary: Current user payslip lines for a month (authenticated)
      description: |
        Query `periodYear`, `periodMonth`. Baris diisi jika ada run `finalized` untuk periode tersebut;
        menggabungkan baris dari run `purpose=monthly`, `purpose=thr`, dan `purpose=pkwt_compensation` bila ada pada periode yang sama.
        `data.run` memilih monthly jika ada, lalu thr, lalu pkwt_compensation.
      security:
        - bearerAuth: []
      parameters:
        - name: periodYear
          in: query
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: periodMonth
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      period:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 1
                          periodYear:
                            type: integer
                            example: 2026
                          periodMonth:
                            type: integer
                            example: 4
                          status:
                            type: string
                            enum: [open, posted]
                      run:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 5
                          purpose:
                            type: string
                            enum: [monthly, thr, pkwt_compensation]
                            example: monthly
                          status:
                            type: string
                            enum: [draft, finalized]
                            example: finalized
                          finalizedAt:
                            type: string
                            format: date-time
                            nullable: true
                      runs:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            purpose:
                              type: string
                              enum: [monthly, thr, pkwt_compensation]
                            status:
                              type: string
                            finalizedAt:
                              type: string
                              format: date-time
                              nullable: true
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            userId:
                              type: integer
                            salaryComponentId:
                              type: integer
                              nullable: true
                            componentCode:
                              type: string
                              nullable: true
                            componentName:
                              type: string
                              nullable: true
                            kind:
                              type: string
                              enum: [addition, deduction]
                            category:
                              type: string
                              nullable: true
                            amount:
                              type: number
                              format: float
                              example: 5000000
                            sortOrder:
                              type: integer
                              example: 1
                            meta:
                              type: object
                              nullable: true
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422':
          description: Validation error - invalid periodYear/periodMonth
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /v1/hcm/payroll/my-thr-slip:
    get:
      tags: [Payroll]
      summary: Slip THR karyawan login (JSON; PDF lewat GET thr-batch/lines/{line}/slip)
      description: |
        Mengembalikan `data.line` + `data.batch` untuk slip PDF terbaru milik user (ada `slip_storage_path`),
        atau `line`/`batch` null jika belum ada. `data.history` berisi `{ lineId, calendarYear }` untuk pemilih tahun.
        Query opsional `calendarYear` memilih slip tahun tersebut.
        Objek `line` menyertakan `thrSlipPublicNo` (unik di DB), `slipNumber` (dengan `#` di depan), `calendarYear`, serta `bankName` / `bankAccountNo` dari profil jika terisi.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarYear
          in: query
          required: false
          schema: { type: integer, minimum: 2000, maximum: 2100, nullable: true }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/pkwt-compensations:
    get:
      tags: [Payroll]
      summary: Preview PKWT compensation list for a selected month (HCM admin)
      description: |
        Mengembalikan daftar karyawan PKWT yang `contract_end_date` jatuh pada bulan yang dipilih,
        berikut estimasi kompensasi proporsional berdasarkan upah bulanan dan masa kerja kontrak.
        Respons juga menyertakan status payroll run PKWT aktif untuk periode yang sama jika sudah pernah diposting.
      security:
        - bearerAuth: []
      parameters:
        - name: periodYear
          in: query
          required: true
