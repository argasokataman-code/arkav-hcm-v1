  /v1/saas/subscription-change-requests/{id}/approve:
    post:
      tags: [SaaS]
      summary: Approve a pending tenant plan change (primary super-admin code-1 only) — F4
      description: |
        Approve mengubah status request menjadi `approved`.
        Untuk action `downgrade`/`cancel`, perubahan paket diterapkan via `ApplySubscriptionChangeJob`
        sesuai `effective_at`.
        Untuk action `upgrade`, approval tidak auto-apply paket agar tidak bypass payment gate.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - bearerAuth: []
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Not found }
        '422': { description: Not pending }

  /v1/saas/subscription-change-requests/{id}/reject:
    post:
      tags: [SaaS]
      summary: Reject a pending tenant plan change (primary super-admin code-1 only) — F4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 500 }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Not found }
        '422': { description: Not pending }

  /v1/saas/invoices:
    post:
