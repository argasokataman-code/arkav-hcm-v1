        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/hcm/overtime-requests:
    get:
      tags: [Overtime]
      summary: List overtime requests (admin all, employee own, paginated)
      security:
        - bearerAuth: []
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [me] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: workDate, in: query, required: false, schema: { type: string, format: date }, description: "Filter single work_date; if set, dateFrom/dateTo ignored" }
        - { name: dateFrom, in: query, required: false, schema: { type: string, format: date } }
        - { name: dateTo, in: query, required: false, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, declined] } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      tags: [Overtime]
      summary: Create overtime request
      description: |
        Admin dapat mengirim `userId` sebagai numeric `users.id`; UUID masih diterima sebagai fallback legacy.
        Target user wajib anggota tenant aktif. Request akan ditolak dengan `OT_ON_LEAVE_CONFLICT`
        bila tanggal lembur bertabrakan dengan leave approved untuk user dan tenant yang sama.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workDate, minutes]
              properties:
                userId:
                  oneOf:
                    - { type: integer }
                    - { type: string, format: uuid }
                  nullable: true
                  description: Admin-only target user identifier. Numeric `users.id` is the active UI contract; UUID is accepted as a legacy fallback. User must belong to the active company.
                overtimeTypeId: { type: integer, nullable: true }
                requestType: { type: string, enum: [employee_request, company_assignment, missed_log_correction], nullable: true }
                workDate: { type: string, format: date }
                minutes: { type: integer, minimum: 1, maximum: 1440 }
                status: { type: string, enum: [pending, approved, declined], nullable: true }
                projectName: { type: string, maxLength: 200, nullable: true }
                notes: { type: string, maxLength: 2000, nullable: true }
                policyNote: { type: string, maxLength: 500, nullable: true }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/overtime-requests/calculate:
    post:
      tags: [Overtime]
      summary: Overtime pay calculator
      description: |
        Estimasi upah lembur (`OvertimePayCalculator`). `data.salaryComponent` menautkan ke master komponen gaji (biasanya `upah_lembur`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseMonthlySalary, minutes, dayType]
              properties:
                baseMonthlySalary: { type: number, minimum: 0 }
                fixedAllowance: { type: number, minimum: 0 }
                minutes: { type: integer, minimum: 1, maximum: 1440 }
                dayType: { type: string, enum: [workday, holiday] }
                weeklyWorkDays: { type: integer, enum: [5, 6] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OvertimeCalculateSuccess'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }

