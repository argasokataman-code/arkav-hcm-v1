name: Deploy Arkav HCM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest .
          
      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest

  deploy-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
            
            docker pull ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest
            docker rm -f arkav-hcm || true
            docker run -d --name arkav-hcm --restart always \
              -p 0.0.0:8007:8007 -p 0.0.0:5179:5179 \
              -v /data/code/.env:/app/backend/.env \
              -v /data/code/storage:/app/backend/storage \
              ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest

            docker exec arkav-hcm bash -c "cd /app/backend && php artisan config:clear && php artisan view:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force"

            sleep 10

            backend_ok=false
            frontend_ok=false
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8007/health >/dev/null 2>&1; then
                backend_ok=true
              fi

              if curl -fsS http://127.0.0.1:5179/ >/dev/null 2>&1; then
                frontend_ok=true
              fi

              if [[ "$backend_ok" == true && "$frontend_ok" == true ]]; then
                break
              fi
              sleep 2
            done

            if [[ "$backend_ok" != true || "$frontend_ok" != true ]]; then
              echo "[deploy] health check failed: backend_ok=$backend_ok frontend_ok=$frontend_ok" >&2
              docker logs --tail 300 arkav-hcm || true
              exit 1
            fi

            docker image prune -a -f
          EOF
