openapi: 3.0.3
info:
  title: Arcav HCM Phase 1 API
  version: 1.0.0
  description: |
    Microservice-style contract for Identity, Core HCM, and Leave domains.
    Implementasi Laravel saat ini menggabungkan banyak endpoint leave/attendance/shift di prefix `/v1/hcm`.
    Lihat `backend/routes/api.php` dan `docs/planning/implementation-status.md` bila path di bawah belum tercantum di file ini.

    ## Quickstart Swagger (Try it out)

    1. Pilih server `http://127.0.0.1:8007` pada dropdown **Servers**.
    2. Login lewat endpoint `POST /v1/identity/auth/login`.
    3. Salin token dari response login, lalu klik tombol **Authorize** dan isi:
       - `Bearer <token>`
    4. Untuk endpoint tenant-scoped di prefix `/v1/hcm/*`, kirim header tenant aktif:
       - `X-Company-Id: <company_uuid>`
    5. Jalankan endpoint HCM sesuai domain (attendance, leave, payroll, shift, dll).

    Catatan:
    - Header `X-Company-Id` dipakai untuk memilih tenant aktif saat user punya akses multi-tenant.
    - Untuk sebagian endpoint list/filter, parameter query wajib (mis. bulan/tahun) sudah didefinisikan pada operation masing-masing.

    ## Tutorial Alur Dasar (Identity -> HCM)

    ### 1) Login

    ```http
    POST /v1/identity/auth/login
    Content-Type: application/json

    {
      "email": "admin@contoh.com",
      "password": "YourStrongPassword123"
    }
    ```

    ### 2) Ambil profil user login

    ```http
    GET /v1/identity/auth/me
    Authorization: Bearer <token>
    X-Company-Id: <company_uuid>
    ```

    ### 3) Akses endpoint HCM tenant-scoped

    ```http
    GET /v1/hcm/employees?page=1&per_page=20
    Authorization: Bearer <token>
    X-Company-Id: <company_uuid>
    ```

    ### 4) Contoh alur payroll monthly ringkas

    1. Baca settings payroll tenant: `GET /v1/hcm/payroll/settings`.
    2. Buat/cek period payroll: `POST /v1/hcm/payroll-periods` atau `GET /v1/hcm/payroll-periods/active`.
    3. Hitung draft: `POST /v1/hcm/payroll-periods/{id}/calculate-draft`.
    4. Finalize run: `POST /v1/hcm/payroll-runs/{id}/finalize`.
    5. Disburse run: `POST /v1/hcm/payroll-runs/{id}/disburse`.

    Untuk alur payroll dengan cutoff/payday policy dan behavior `policySnapshot`, lihat deskripsi operation Payroll dan dokumen feature payroll terkait.

    ## Global Super Admin bypass

    Pengguna dengan `users.is_super_admin = 1` (Global Developer / Platform
    Maintainer) melewati:
    - tenant scoping `company_id` di seluruh endpoint `/v1/hcm/*`
      (`HcmLeaveRequest`, `HcmPayrollRun`, `HcmPayrollItem`, `HcmPayrollPeriod`,
      `HcmPayrollItemAssignment`, `HcmShift`, `HcmEmployee`, `Attendance`);
    - subscription feature gate `SUBSCRIPTION_REQUIRED` pada ticket dan asset
      management;
    - requirement membership `company_users` di `TenantContextResolver`
      (membership virtual dibuat ad-hoc untuk konteks request, tidak dipersist).

    Akun ini mengakses seluruh tenant tanpa perlu `X-Company-Id` header
    tertentu; header tetap dihormati untuk memilih tenant aktif. Fallback
    bootstrap `config('hcm.admin_email')` tetap ada untuk fresh-install
    sebelum backfill migrasi selesai.

    ## Recent Security Updates (Non-Contract)

    **2026-04-22 (Cycles 0-4):** Security hardening via unique validation refactoring, secret containment, dependency remediation (npm audit 0), SAST gate enforcement.
    No API contract/response shape changes. See: `docs/features/security-check/` for full scope.
servers:
  # Local backend (Laravel artisan serve via ./run.sh)
  - url: http://127.0.0.1:8007
    description: Local backend (recommended for Swagger Try it out)
  # Local frontend proxy (Node) - optional, may require CORS depending on setup
  - url: http://127.0.0.1:5179
    description: Local frontend proxy (optional)
  - url: https://api.example.com
    description: Production (placeholder)
tags:
  - name: Identity
  - name: HCM
  - name: Tickets
  - name: Attendance
  - name: Leave
  - name: Overtime
  - name: Payroll
  - name: Tax Governance
  - name: BPJS Governance
  - name: Holidays
  - name: Training
  - name: Performance
  - name: Asset Management
  - name: Promotion
  - name: Resignation
  - name: Termination
  - name: SaaS
  - name: User Management
  - name: Reporting
  - name: Data Privacy
paths:
  /v1/identity/auth/register:
    post:
      tags: [Identity]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/identity/auth/login:
    post:
      tags: [Identity]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /v1/identity/auth/logout:
    post:
      tags: [Identity]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/identity/auth/me:
    get:
      tags: [Identity]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /v1/identity/auth/profile:
    put:
      tags: [Identity]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/public/onboarding:
    post:
      tags: [SaaS]
      summary: Public onboarding (guest) — create company + owner + subscription (+ optional invoice)
      description: |
        Guest endpoint for self-serve onboarding. Creates:
        - User (owner)
        - Company (tenant) + CompanyUser owner mapping
        - Subscription (trial by default; or pending_payment + invoice draft)
        Rate limited by throttle middleware.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_uuid, billing_cycle, company, owner]
              properties:
                package_uuid: { type: string, format: uuid }
                billing_cycle: { type: string, enum: [monthly, yearly] }
                start_mode: { type: string, enum: [trial, pending_payment], nullable: true }
                billingEmail: { type: string, format: email, nullable: true, maxLength: 255 }
                turnstile_token:
                  type: string
                  maxLength: 2048
                  nullable: true
                  description: Required when Turnstile is enabled on the server.
                website:
                  type: string
                  maxLength: 200
                  nullable: true
                  description: Honeypot field for bots. Must be empty.
                company:
                  type: object
                  required: [name, timezone, currency, country_code, address, city]
                  properties:
                    code:
                      type: string
                      maxLength: 100
                      pattern: '^[A-Za-z0-9_-]+$'
                      nullable: true
                      description: Optional. If omitted, server auto-generates a unique code.
                    name: { type: string, maxLength: 255 }
                    legal_name: { type: string, maxLength: 255, nullable: true }
                    timezone: { type: string, maxLength: 100 }
                    currency: { type: string, maxLength: 10 }
                    country_code: { type: string, maxLength: 10 }
                    contact_phone:
                      type: string
                      maxLength: 30
                      nullable: true
                      pattern: '^[0-9+\-\s().]{6,30}$'
                      description: Optional. Company contact phone for billing/support.
                    contact_person_name:
                      type: string
                      maxLength: 120
                      nullable: true
                      description: Optional. Sales follow-up contact person name.
                    contact_person_role:
                      type: string
                      maxLength: 120
                      nullable: true
                      description: Optional. Sales follow-up contact person role/title.
                    address:
                      type: string
                      maxLength: 500
                      description: Company address.
                    city:
                      type: string
                      maxLength: 120
                    postal_code:
                      type: string
                      maxLength: 12
                      nullable: true
                      pattern: '^[0-9]{3,12}$'
                      description: Optional. Postal code.
                owner:
                  type: object
                  required: [name, email, password, confirmPassword]
                  properties:
                    name: { type: string, minLength: 2, maxLength: 150, pattern: "^[A-Za-z][A-Za-z\\s'.-]{1,149}$" }
                    email: { type: string, format: email, maxLength: 255 }
                    phone:
                      type: string
                      maxLength: 30
                      nullable: true
                      pattern: '^[0-9+\-\s().]{6,30}$'
                      description: Optional. Owner phone.
                    password: { type: string, minLength: 8, maxLength: 64, pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d)[A-Za-z\\d@$!%*?&._-]{8,64}$' }
                    confirmPassword: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      company:
                        type: object
                        properties:
                          id: { type: integer }
                          code: { type: string }
                          name: { type: string }
                      owner:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          email: { type: string }
                      subscription:
                        type: object
                        properties:
                          id: { type: integer }
                          status: { type: string, enum: [trial, pending_payment] }
                          startsAt: { type: string, format: date-time }
                          endsAt: { type: string, format: date-time }
                          trialEndsAt: { type: string, format: date-time, nullable: true }
                          billingCycle: { type: string, enum: [monthly, yearly] }
                          amount: { type: number }
                          packageId: { type: string, format: uuid }
                          packageCode: { type: string }
                          packageName: { type: string }
                      invoice:
                        type: object
                        nullable: true
                        properties:
                          id: { type: integer }
                          invoiceNumber: { type: string, nullable: true }
                          issueDate: { type: string, format: date }
                          amountDue: { type: number }
                          isPaid: { type: boolean }
                          status: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

  /v1/hcm/settings:
    get:
      tags: [HCM]
      summary: Get settings by group
      security:
        - bearerAuth: []
      parameters:
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum: [general, business, localization, seo]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [HCM]
      summary: Save settings by group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, settings]
              properties:
                group:
                  type: string
                  enum: [general, business, localization, seo]
                settings:
                  type: object
                  additionalProperties: true
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/email-settings/mailtrap-status:
    get:
      tags: [HCM]
      summary: Get Mailtrap connection status for email settings (global HCM admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  message: { type: string, nullable: true }
                  data:
                    type: object
                    properties:
                      provider: { type: string, example: mailtrap }
                      accountId: { type: integer, nullable: true }
                      tokenConfigured: { type: boolean }
                      tokenLast4: { type: string, nullable: true }
                      connected: { type: boolean }
                      visibleTokenCount: { type: integer }
                      visibleTokens:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, nullable: true }
                            name: { type: string, nullable: true }
                            last4: { type: string, nullable: true }
                            expiresAt: { type: string, format: date-time, nullable: true }
                      error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/hcm/email-settings:
    get:
      tags: [HCM]
      summary: Get current email settings profile (global HCM admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      provider: { type: string, example: smtp }
                      fromAddress: { type: string, nullable: true }
                      fromName: { type: string, nullable: true }
                      smtp:
                        type: object
                        properties:
                          host: { type: string, nullable: true }
                          port: { type: integer }
                          encryption: { type: string, nullable: true }
                          username: { type: string, nullable: true }
                          passwordMasked: { type: string, nullable: true }
                          configured: { type: boolean }
                      mailtrap:
                        type: object
                        properties:
                          accountId: { type: integer, nullable: true }
                          apiTokenMasked: { type: string, nullable: true }
                          configured: { type: boolean }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    put:
      tags: [HCM]
      summary: Update current email settings profile (global HCM admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [smtp, mailtrap]
                fromAddress:
                  type: string
                  format: email
                  nullable: true
                fromName:
                  type: string
                  nullable: true
                smtp:
                  type: object
                  nullable: true
                  properties:
                    host: { type: string, nullable: true }
                    port: { type: integer, minimum: 1, maximum: 65535, nullable: true }
                    encryption: { type: string, enum: [tls, ssl, none], nullable: true }
                    username: { type: string, nullable: true }
                    password: { type: string, nullable: true }
                mailtrap:
                  type: object
                  nullable: true
                  properties:
                    accountId: { type: integer, minimum: 1, nullable: true }
                    apiToken: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      provider: { type: string }
                      fromAddress: { type: string, nullable: true }
                      fromName: { type: string, nullable: true }
                      smtp:
                        type: object
                        properties:
                          host: { type: string, nullable: true }
                          port: { type: integer }
                          encryption: { type: string, nullable: true }
                          username: { type: string, nullable: true }
                          passwordMasked: { type: string, nullable: true }
                          configured: { type: boolean }
                      mailtrap:
                        type: object
                        properties:
                          accountId: { type: integer, nullable: true }
                          apiTokenMasked: { type: string, nullable: true }
                          configured: { type: boolean }
                  meta:
                    type: object
                    properties:
                      updatedBy:
                        type: object
                        properties:
                          id: { type: integer, nullable: true }
                          uuid: { type: string, format: uuid, nullable: true }
                          email: { type: string, format: email, nullable: true }
                      updatedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/email-settings/compose:
    post:
      tags: [HCM]
      summary: Send a runtime email from the admin compose UI using the active email settings profile (global HCM admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, message]
              properties:
                to:
                  type: string
                  format: email
                subject:
                  type: string
                  maxLength: 255
                message:
                  type: string
                  maxLength: 5000
      responses:
        '200':
          description: Email sent
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      to: { type: string, format: email }
                      subject: { type: string }
                      sentAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Too many requests }
        '500':
          description: Email send failed
          content:
            application/json:
              schema:
                type: object
                required: [success, error]
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code: { type: string, example: EMAIL_SEND_FAILED }
                      message: { type: string }

  /v1/hcm/email-settings/test-connection:
    post:
      tags: [HCM]
      summary: Test temporary email provider credentials without persisting them (global HCM admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [smtp, mailtrap]
                timeout:
                  type: integer
                  minimum: 1
                  maximum: 30
                  nullable: true
                smtp:
                  type: object
                  nullable: true
                  properties:
                    host: { type: string, nullable: true }
                    port: { type: integer, minimum: 1, maximum: 65535, nullable: true }
                    encryption: { type: string, enum: [tls, ssl, none], nullable: true }
                    username: { type: string, nullable: true }
                    password: { type: string, nullable: true }
                mailtrap:
                  type: object
                  nullable: true
                  properties:
                    accountId: { type: integer, minimum: 1, nullable: true }
                    apiToken: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      provider: { type: string }
                      mode: { type: string, example: ephemeral }
                      persisted: { type: boolean, example: false }
                      connected: { type: boolean }
                      testedAt: { type: string, format: date-time }
                      details:
                        type: object
                        nullable: true
                        properties:
                          host: { type: string, nullable: true }
                          port: { type: integer, nullable: true }
                          encryption: { type: string, nullable: true }
                          username: { type: string, nullable: true }
                          timeout: { type: integer, nullable: true }
                      accountId: { type: integer, nullable: true }
                      tokenConfigured: { type: boolean, nullable: true }
                      visibleTokenCount: { type: integer, nullable: true }
                      visibleTokens:
                        type: array
                        nullable: true
                        items:
                          type: object
                          properties:
                            id: { type: integer, nullable: true }
                            name: { type: string, nullable: true }
                            last4: { type: string, nullable: true }
                            expiresAt: { type: string, format: date-time, nullable: true }
                      error:
                        type: object
                        nullable: true
                        properties:
                          code: { type: string, nullable: true }
                          message: { type: string, nullable: true }
                  meta:
                    type: object
                    properties:
                      lastTestStatus:
                        type: object
                        properties:
                          provider: { type: string, nullable: true }
                          mode: { type: string, nullable: true }
                          connected: { type: boolean }
                          testedAt: { type: string, format: date-time, nullable: true }
                          details:
                            type: object
                            nullable: true
                          error:
                            type: object
                            properties:
                              code: { type: string, nullable: true }
                              message: { type: string, nullable: true }
                          updatedBy:
                            type: object
                            properties:
                              id: { type: integer, nullable: true }
                              uuid: { type: string, format: uuid, nullable: true }
                              email: { type: string, format: email, nullable: true }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /webhooks/email-inbound:
    post:
      tags: [Webhook]
      summary: Receive inbound email event and persist it into runtime inbox log
      parameters:
        - in: header
          name: X-Email-Inbound-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id: { type: string, nullable: true }
                from: { type: string, nullable: true }
                to: { type: string, nullable: true }
                subject: { type: string, nullable: true }
                text: { type: string, nullable: true }
                html: { type: string, nullable: true }
                received_at: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Inbound event accepted (new or duplicate)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      duplicate: { type: boolean }
                      deliveryId: { type: integer }
                      messageId: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { description: Too many requests }
        '503':
          description: Inbound webhook token is not configured
          content:
            application/json:
              schema:
                type: object
                required: [success, error]
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code: { type: string }
                      message: { type: string }

  /webhooks/email-delivery-status:
    post:
      tags: [Webhook]
      summary: Receive outbound provider status callback and update compose delivery final status
      parameters:
        - in: header
          name: X-Email-Delivery-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, nullable: true }
                delivery_uuid: { type: string, nullable: true }
                deliveryUuid: { type: string, nullable: true }
                notification_uuid: { type: string, nullable: true }
                message-id: { type: string, nullable: true }
                status: { type: string, nullable: true }
                reason: { type: string, nullable: true }
      responses:
        '200':
          description: Delivery status callback accepted and persisted
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      deliveryId: { type: integer }
                      deliveryUuid: { type: string }
                      event: { type: string }
                      status: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404':
          description: Delivery uuid not found in compose outbound log
        '422':
          description: Delivery uuid is required in webhook payload
        '429': { description: Too many requests }
        '503':
          description: Delivery status webhook token is not configured

