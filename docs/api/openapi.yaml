  /v1/saas/subscriptions:
    get:
      tags: [SaaS]
      summary: List subscriptions (HCM admin)
      description: Admin-only listing for subscriptions across the active SaaS admin surface.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, trial, pending_payment, inactive, expired, cancelled, suspended]
        - name: billing_cycle
          in: query
          schema: { type: string, enum: [monthly, yearly] }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: company_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: plan_code
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SaasSubscription' }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      per_page: { type: integer }
                      current_page: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [SaaS]
      summary: Create subscription (HCM admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, package_uuid, status, starts_at, billing_cycle]
              properties:
                company_id: { type: string, format: uuid }
                package_uuid: { type: string, format: uuid }
                status:
                  type: string
                  enum: [active, trial, pending_payment, inactive, expired, cancelled, suspended]
                starts_at: { type: string, format: date }
                ends_at:
                  type: string
                  format: date
                  nullable: true
                  description: Required when status is active, trial, or pending_payment (payment / provisioning window end)
                trial_ends_at:
                  type: string
                  format: date
                  nullable: true
                  description: Required when status is trial; must be after starts_at and on or before ends_at
                auto_renew: { type: boolean }
                billing_cycle: { type: string, enum: [monthly, yearly] }
                amount: { type: number, minimum: 0, nullable: true }
      responses:
        '201':
          description: Created
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/saas/subscriptions/{subscription}:
    parameters:
      - name: subscription
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [SaaS]
      summary: Get subscription by id (HCM admin)
      description: Admin-only detail lookup for one subscription.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/SaasSubscription' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [SaaS]
      summary: Update subscription (HCM admin)
      description: |
        Supports manual status updates.
        If status transitions from `suspended` to `active`, server clears suspension/grace markers,
        records a `subscription_events` audit entry (`event_type=resumed`, reason code `SUBSCRIPTION_REACTIVATED_MANUAL_UPDATE`),
        stores audit payload markers `source=subscription_update`, `from_status=suspended`, `to_status=active`,
        and sends reactivation email to the company billing contact.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                package_uuid: { type: string, format: uuid }
                status:
                  type: string
                  enum: [active, trial, pending_payment, inactive, expired, cancelled, suspended]
                starts_at: { type: string, format: date }
                ends_at: { type: string, format: date, nullable: true }
                trial_ends_at:
                  type: string
                  format: date
                  nullable: true
                  description: Required when resulting status is trial; send null to clear when leaving trial
                auto_renew: { type: boolean }
                billing_cycle: { type: string, enum: [monthly, yearly] }
                amount: { type: number, minimum: 0, nullable: true }
      responses:
        '200':
          description: OK
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [SaaS]
      summary: Delete subscription disabled (HCM admin)
      description: Hard delete is disabled for subscriptions. Use cancel/status lifecycle actions instead.
      security:
        - bearerAuth: []
      responses:
        '409':
          description: Hard delete disabled for subscription lifecycle safety
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code: { type: string, example: SUBSCRIPTION_DELETE_DISABLED }
                      message: { type: string, example: Hard delete is disabled for subscriptions. Use cancel to end the subscription lifecycle. }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /v1/saas/subscriptions/{subscription}/renew:
    parameters:
      - name: subscription
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [SaaS]
      summary: Renew subscription — sets active, starts_at now, ends_at from body (HCM admin)
      description: |
        Typical prior statuses: expired, cancelled, suspended, inactive. Not valid for `pending_payment` (422).
        When renewing from `suspended`, server also clears suspension/grace markers,
        records a `subscription_events` audit entry (`event_type=resumed`, reason code `SUBSCRIPTION_REACTIVATED_MANUAL_RENEW`),
        and sends reactivation email to the company billing contact.
        Web UI `/saas/subscriptions` may resolve `{subscription}` via **Renew by UUID** (`GET /v1/saas/subscriptions/{subscription}` first).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ends_at]
              properties:
                ends_at: { type: string, format: date }
      responses:
        '200':
          description: OK
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/subscriptions/preview-change:
    post:
      tags: [HCM Billing]
      summary: Preview tenant-initiated plan change (owner / tenant admin) — F4
      description: |
        Dry-run perhitungan selisih harga dan jadwal berlakunya untuk upgrade / downgrade / cancel.
        Tidak menulis apa pun; aman dipanggil berulang dari UI `/upgrade`.
        `to_package_uuid` untuk upgrade/downgrade wajib mengarah ke package `status=active`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [upgrade, downgrade, cancel] }
                to_package_uuid:
                  type: string
                  format: uuid
                  nullable: true
                  description: Wajib untuk upgrade/downgrade; abaikan untuk cancel.
      responses:
        '200': { description: OK }
        '400': { description: Active company context required }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/subscriptions/change-plan:
    post:
      tags: [HCM Billing]
      summary: Submit plan change request (owner / tenant admin) — F4
      description: |
        Mencatat request status `pending` untuk disetujui super-admin. Hanya boleh ada satu request
        pending per company (duplicate → `409 CHANGE_REQUEST_PENDING`).
        `to_package_uuid` untuk upgrade/downgrade wajib package aktif (`422 PACKAGE_NOT_ACTIVE`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [upgrade, downgrade, cancel] }
                to_package_uuid: { type: string, format: uuid, nullable: true }
                notes: { type: string, maxLength: 500, nullable: true }
      responses:
        '201': { description: Pending request created }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { description: Pending request already exists }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/subscriptions/cancel-change:
    post:
      tags: [HCM Billing]
      summary: Cancel a pending tenant plan change request — F4
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Not found }
        '422': { description: Not pending }

  /v1/hcm/subscriptions/change-requests:
    get:
      tags: [HCM Billing]
      summary: List plan change requests for active tenant — F4
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/saas/subscription-change-requests:
    get:
      tags: [SaaS]
      summary: List all tenant plan change requests (primary super-admin code-1 only) — F4
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, applied, cancelled] }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/saas/subscription-change-requests/{id}/approve:
    post:
      tags: [SaaS]
      summary: Approve a pending tenant plan change (primary super-admin code-1 only) — F4
      description: |
        Approve mengubah status request menjadi `approved`.
        Untuk action `downgrade`/`cancel`, perubahan paket diterapkan via `ApplySubscriptionChangeJob`
        sesuai `effective_at`.
        Untuk action `upgrade`, approval tidak auto-apply paket agar tidak bypass payment gate.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - bearerAuth: []
      responses:
        '200': { description: Approved }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Not found }
        '422': { description: Not pending }

  /v1/saas/subscription-change-requests/{id}/reject:
    post:
      tags: [SaaS]
      summary: Reject a pending tenant plan change (primary super-admin code-1 only) — F4
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 500 }
      responses:
        '200': { description: Rejected }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Not found }
        '422': { description: Not pending }

  /v1/saas/invoices:
    post:
      tags: [SaaS]
      summary: Create invoice (HCM admin)
      description: |
        Optional `subscription_id` must reference a subscription for the same `company_id`.
        When the invoice is later marked paid, a linked subscription in `pending_payment` becomes `active`
        (paid period starts from payment date; see `SubscriptionActivationFromInvoiceService`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
