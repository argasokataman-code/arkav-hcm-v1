                            type: string
                            format: date-time
                            nullable: true
                          finalizedByUserId:
                            type: integer
                            nullable: true
                          policySnapshot:
                            type: object
                            nullable: true
                            properties:
                              paydayDay: { type: integer, minimum: 1, maximum: 31, example: 28 }
                              cutoffOffsetDays: { type: integer, minimum: 0, maximum: 15, example: 3 }
                              payrollTimezone: { type: string, example: Asia/Jakarta }
                              disburseBeforePaydayAllowed: { type: boolean, example: false }
                              paydayHolidayStrategy: { type: string, enum: [previous_working_day, next_working_day, exact_calendar_day], example: previous_working_day }
                              resolvedPaydayDate: { type: string, format: date, nullable: true, example: '2026-04-28' }
                              resolvedCutoffDate: { type: string, format: date, nullable: true, example: '2026-04-25' }
                              draftDataAsOfDate: { type: string, format: date, nullable: true, example: '2026-04-30' }
                          lateArrivalBuffer:
                            type: object
                            nullable: true
                            properties:
                              capturedAt: { type: string, format: date-time, nullable: true }
                              asOfDate: { type: string, format: date, nullable: true }
                              periodStartDate: { type: string, format: date, nullable: true }
                              periodEndDate: { type: string, format: date, nullable: true }
                              hasLateArrivals: { type: boolean, example: false }
                              migrationMode: { type: string, nullable: true, example: next-period-date-based-rollover }
                              sources:
                                type: object
                                nullable: true
                                properties:
                                  overtimeRequests:
                                    type: object
                                    nullable: true
                                    properties:
                                      totalCount: { type: integer, example: 0 }
                                  payrollItemAssignments:
                                    type: object
                                    nullable: true
                                    properties:
                                      totalCount: { type: integer, example: 0 }
                          voidedAt:
                            type: string
                            format: date-time
                            nullable: true
                          voidedByUserId:
                            type: integer
                            nullable: true
