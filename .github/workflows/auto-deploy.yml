# Arsitektur deploy baru: volume-based (tidak ada image build/push per commit)
# Kode di-deploy via git pull di server. Vendor & node_modules persist di named volume.
# Estimasi waktu deploy: ~2-4 menit (vs ~15-20 menit sebelumnya).

name: Deploy Arkav HCM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy runtime guard
        run: bash scripts/check-deploy-runtime-guard.sh

      - name: Deploy to server via SSH
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
            set -euo pipefail

            # --- 1. Pastikan host storage dirs ada (runtime guard wajib) ---
            mkdir -p /data/code/storage/logs
            mkdir -p /data/code/storage/framework/cache/data
            mkdir -p /data/code/storage/framework/sessions
            mkdir -p /data/code/storage/framework/views
            mkdir -p /data/code/storage/app/public
            mkdir -p /data/code/storage/app/private

            cd /data/code

            # --- 2. Pull latest code (tidak ada image rebuild) ---
            echo "[deploy] git pull origin main..."
            git pull origin main

            # --- 3. PHP deps ke named volume (cepat: hanya download package baru) ---
            echo "[deploy] composer install (diff only)..."
            docker-compose run --rm --no-deps arkav-hcm \
              bash -c "cd /app/backend && composer install --no-dev --optimize-autoloader --ignore-platform-req=php --no-scripts && php artisan package:discover --ansi"

            # --- 4. Node deps + Vite build ke named volume (cepat: npm ci diff) ---
            echo "[deploy] npm ci + npm run build..."
            docker-compose run --rm --no-deps arkav-hcm \
              bash -c "cd /app/backend && npm ci && npm run build"

            # --- 5. Restart container (kode baru sudah terbaca via volume, no rebuild) ---
            echo "[deploy] docker-compose up -d..."
            docker-compose up -d --force-recreate arkav-hcm

            # --- 6. Runtime dirs + artisan commands ---
            sleep 5
            docker-compose exec -T arkav-hcm bash -c "cd /app/backend && mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public storage/app/private bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache && php artisan config:clear && php artisan view:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force"

            # --- 7. Health check (backend + frontend) ---
            backend_ok=false
            frontend_ok=false
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8007/health >/dev/null 2>&1 && backend_ok=true
              curl -fsS http://127.0.0.1:5179/ >/dev/null 2>&1 && frontend_ok=true
              [[ "$backend_ok" == true && "$frontend_ok" == true ]] && break
              sleep 2
            done

            if [[ "$backend_ok" != true || "$frontend_ok" != true ]]; then
              echo "[deploy] Health check FAILED: backend=$backend_ok frontend=$frontend_ok" >&2
              docker-compose logs --tail 300 arkav-hcm || true
              exit 1
            fi

            echo "[deploy] Deploy successful!"            if [[ "$backend_ok" == true && "$frontend_ok" == true ]]; then
                break
              fi
              sleep 2
            done

            if [[ "$backend_ok" != true || "$frontend_ok" != true ]]; then
              echo "[deploy] health check failed: backend_ok=$backend_ok frontend_ok=$frontend_ok" >&2
              docker logs --tail 300 arkav-hcm || true
              exit 1
            fi

            docker image prune -f || true
          EOF
