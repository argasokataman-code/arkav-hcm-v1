name: CI/CD - Shared Hosting Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gate:
    name: Test Gate (PHPUnit + Vitest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, bcmath, ctype, json, mbstring, openssl, pdo, pdfakerphp, tokenizer
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migration
        working-directory: backend
        run: php artisan migrate --force --env=testing
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run PHPUnit tests
        working-directory: backend
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run Vitest
        working-directory: backend
        run: npx vitest run

  build:
    name: Build Artifact
    needs: gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, bcmath, ctype, json, mbstring, openssl, pdo, pdobj, tokenizer
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Build production artifact
        run: |
          bash scripts/shared-hosting-package-local.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-hosting-artifact
          path: release/shared-hosting/shared-hosting-artifact-*.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: shared-hosting-artifact
          path: ./

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload artifact to server
        run: |
          ARTIFACT=$(ls -t shared-hosting-artifact-*.tar.gz | head -1)
          scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key "$ARTIFACT" ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/public_html/hr.jogjatourdrive.com/

      - name: Extract and deploy on server
        run: |
          ARTIFACT=$(ls -t shared-hosting-artifact-*.tar.gz | head -1)
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -euo pipefail
          cd /home/${{ secrets.SSH_USER }}/public_html/hr.jogjatourdrive.com
          tar -xzf $(basename "$ARTIFACT")
          bash scripts/shared-hosting-deploy-easy.sh
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
