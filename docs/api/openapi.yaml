                calculationCutoffDate: { type: string, format: date, nullable: true }
                notes: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch:
    get:
      tags: [Payroll]
      summary: THR mass batch for a calendar year (HCM admin)
      description: |
        Draft batch terbaru atau batch assigned terakhir untuk `calendarYear`, beserta `lines[]`.
        Setiap elemen `lines[]` menyertakan `bankName` dan `bankAccountNo` (dari profil karyawan; nullable) untuk verifikasi sebelum disburse.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarYear
          in: query
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/generate:
    post:
      tags: [Payroll]
      summary: Regenerate THR draft list for a year (HCM admin)
      description: |
        Membutuhkan `calculationCutoffDate` di thr-settings tahun tersebut. Endpoint ini membutuhkan permission `payroll.thr.manage`.
        `422` THR_SETUP_CUTOFF_REQUIRED / THR_YEAR_ALREADY_ASSIGNED.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calendarYear]
              properties:
                calendarYear: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/disburse:
    post:
      tags: [Payroll]
      summary: Catat pembayaran manual THR (subset userIds, HCM admin)
      description: |
        Batch harus `draft`. Endpoint ini membutuhkan permission `payroll.disburse`.
        Baris `paid` dilewati. Baris yang dipilih akan ditandai `paymentStatus=paid`, disimpan manual completion reference-nya, lalu generate slip PDF.
        Evidence export reconciliation runtime aktif memakai schema payment-ready yang sama dengan monthly payroll dan PKWT compensation.
        Saat fitur reconciliation enforcement aktif, endpoint juga dapat mengembalikan
        `EXPORT_RECON_REQUIRED` / `EXPORT_RECON_EXPIRED` / `EXPORT_RECON_SCOPE_MISMATCH` / `EXPORT_RECON_STALE_DATA`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, userIds]
              properties:
                batchId: { type: integer }
                userIds:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/post-payroll:
    post:
      tags: [Payroll]
      summary: Posting batch THR ke run payroll final (HCM admin)
      description: |
        Membutuhkan semua baris eligible THR>0 sudah `paid`. Endpoint ini membutuhkan permission `payroll.thr.manage`.
        `paymentDate` di thr-settings. Run `purpose=thr` final; batch jadi `assigned`.
        `422` THR_POST_UNPAID_PAYABLE_LINES jika masih ada eligible belum paid.
        Saat fitur reconciliation enforcement aktif, endpoint juga dapat mengembalikan
        `EXPORT_RECON_REQUIRED` / `EXPORT_RECON_EXPIRED` / `EXPORT_RECON_SCOPE_MISMATCH` / `EXPORT_RECON_STALE_DATA`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId]
              properties:
                batchId: { type: integer }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/send-slip:
    post:
      tags: [Payroll]
      summary: Tandai slip THR sudah dikirim (bulk, HCM admin)
      description: |
        Mencatat `slip_notify_sent_at` untuk `lineIds` di `batchId`. Endpoint ini membutuhkan permission `payroll.thr.manage`.
        Integrasi email/WA dapat ditambahkan di belakang endpoint ini.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, lineIds]
              properties:
                batchId: { type: integer }
                lineIds:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/lines/{line}/slip:
    get:
      tags: [Payroll]
      summary: Unduh/preview PDF slip THR untuk satu baris batch
      description: |
        **HCM admin** semua baris. **Karyawan** hanya jika `line` milik user login (`user_id` sama).
      security:
        - bearerAuth: []
      parameters:
        - name: line
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: application/pdf
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: THR_SLIP_NOT_FOUND / THR_SLIP_FILE_MISSING }
  /v1/reconciliation/exports:
    post:
      tags: [Reporting]
      summary: Create export reconciliation evidence (HCM admin)
      description: |
        Menyimpan evidence export untuk gate aksi berisiko. Endpoint ini membutuhkan tenant context aktif.

        **Kompatibilitas UI:** klien payroll/THR/PKWT mengirim `format` (alias `fileFormat`) dan `filterPayload`.
        Jika `filePath` tidak dikirim dan `fileFormat`/`format` adalah **`csv`** atau **`xlsx`**, server akan **menulis file evidence**
        ke disk `local` pada path `reconciliation/generated/...` lalu menyimpan evidence.

        Untuk `featureKey/actionKey` payroll berikut:
        - `payroll_run/disburse`
        - `thr_batch/disburse`
        - `thr_batch/post_payroll`
        - `pkwt_compensation/post_payroll`

        payload yang digenerate server berbentuk summary pembayaran per karyawan dengan schema seragam:
        `payroll_type`, `reference_period`, `reference_id`, `employee_id`, `employee_name`, `bank_name`, `account_number`,
        `account_holder_name`, `bank_branch`, `gross_total`, `overtime_total`, `deductions_total`, `transfer_amount`, `bank_data_status`,
        `dataset_checksum`.

        Untuk `pdf`, `filePath` tetap **wajib**.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [featureKey, actionKey, scopeRef]
              properties:
                featureKey:
                  type: string
                  enum: [payroll_run, thr_batch, pkwt_compensation, invoice, payment]
                actionKey:
                  type: string
                  enum: [finalize, disburse, post_payroll, mark_paid, verify]
                scopeRef: { type: string }
                fileFormat: { type: string, enum: [csv, xlsx, pdf] }
                format:
                  description: Alias untuk `fileFormat` (kompatibilitas klien).
                  type: string
                  enum: [csv, xlsx, pdf]
                filePath:
                  description: Path relatif di disk `local`. Wajib untuk `pdf`; opsional untuk `csv|xlsx` (auto-generate bila kosong).
                  type: string
                rowCount:
                  description: Opsional; jika tidak dikirim akan diinfer dari `filterPayload` (mis. `lineIds` / `periods`) atau 0.
                  type: integer
                  minimum: 0
                filterPayload:
                  type: object
                  additionalProperties: true
                filters:
                  description: Alias untuk `filterPayload` (kompatibilitas kontrak awal).
                  type: object
                  additionalProperties: true
                datasetChecksum: { type: string, nullable: true }
                expiresInMinutes: { type: integer, minimum: 1, maximum: 43200, nullable: true }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Reporting]
      summary: List export reconciliation evidence (HCM admin)
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: featureKey, in: query, required: false, schema: { type: string, enum: [payroll_run, thr_batch, pkwt_compensation, invoice, payment] } }
        - { name: actionKey, in: query, required: false, schema: { type: string, enum: [finalize, disburse, post_payroll, mark_paid, verify] } }
        - { name: scopeRef, in: query, required: false, schema: { type: string } }
        - { name: includeExpired, in: query, required: false, schema: { type: boolean } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/reconciliation/exports/{id}/download:
    get:
      tags: [Reporting]
      summary: Download reconciliation export file by evidence id (HCM admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Binary export file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/hcm/attendance/admin/records/{id}/selfie/download:
    get:
      tags: [Attendance]
      summary: Download employee selfie by attendance record id (HCM admin)
      description: |
        Download file selfie yang disimpan di storage private untuk satu attendance record.
        **HCM Admin only** dan tenant-scoped.
