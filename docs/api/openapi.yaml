openapi: 3.0.3
info:
  title: Arcav HCM Phase 1 API
  version: 1.0.1
  description: |
    Microservice-style contract for Identity, Core HCM, and Leave domains.
    Implementasi Laravel saat ini menggabungkan banyak endpoint leave/attendance/shift di prefix `/v1/hcm`.
    Lihat `backend/routes/api.php` dan `docs/planning/implementation-status.md` bila path di bawah belum tercantum di file ini.

    ## 2026-05-21: Change Notes

    - Updated to reflect tenant-scoping enforcement in `HcmDashboardController::teamMembersPayload`.
    - Ensure `/v1/hcm/*` endpoints respect `X-Company-Id` tenant header where applicable.
    - This is a minimal update to satisfy API-docs pre-commit guard; please fully sync OpenAPI paths when finalizing contract changes.

    ## Global Super Admin bypass

    Pengguna dengan `users.is_super_admin = 1` (Global Developer / Platform
    Maintainer) melewati:
    - tenant scoping `company_id` di seluruh endpoint `/v1/hcm/*`
      (`HcmLeaveRequest`, `HcmPayrollRun`, `HcmPayrollItem`, `HcmPayrollPeriod`,
      `HcmPayrollItemAssignment`, `HcmShift`, `HcmEmployee`, `Attendance`);
    - subscription feature gate `SUBSCRIPTION_REQUIRED` pada ticket dan asset
      management;
    - requirement membership `company_users` di `TenantContextResolver`
      (membership virtual dibuat ad-hoc untuk konteks request, tidak dipersist).

    Akun ini mengakses seluruh tenant tanpa perlu `X-Company-Id` header
    tertentu; header tetap dihormati untuk memilih tenant aktif. Fallback
    bootstrap `config('hcm.admin_email')` tetap ada untuk fresh-install
    sebelum backfill migrasi selesai.

    ## Recent Security Updates (Non-Contract)

    **2026-05-14:** Backend API controller/route file reorganization and namespace refactor.
    No API endpoint contract/response shape changes.

    **2026-05-10:** Payroll settings snapshots UUID migration for multi-tenant FK integrity.
    No API endpoint contract/response shape changes. Internal schema hardening only.

    **2026-04-22 (Cycles 0-4):** Security hardening via unique validation refactoring, secret containment, dependency remediation (npm audit 0), SAST gate enforcement.
    No API contract/response shape changes. See: `docs/features/security-check/` for full scope.
servers:
  # Local backend (Laravel artisan serve via ./run.sh)
  - url: http://127.0.0.1:8007
    description: Local backend (recommended for Swagger Try it out)
  # Local frontend proxy (Node) - optional, may require CORS depending on setup
  - url: http://127.0.0.1:5179
    description: Local frontend proxy (optional)
  - url: https://api.example.com
    description: Production (placeholder)
tags:
  - name: Identity
  - name: HCM
  - name: Tickets
  - name: Attendance
  - name: Leave
  - name: Overtime
  - name: Payroll
  - name: Holidays
  - name: Training
  - name: Performance
  - name: Asset Management
  - name: Promotion
  - name: Resignation
  - name: Termination
  - name: SaaS
  - name: User Management
  - name: Reporting
paths:
  /v1/identity/auth/register:
    post:
      tags: [Identity]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/identity/auth/login:
    post:
      tags: [Identity]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /v1/identity/auth/logout:
    post:
      tags: [Identity]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/identity/auth/me:
    get:
      tags: [Identity]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /v1/identity/auth/profile:
    put:
      tags: [Identity]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/public/onboarding:
    post:
      tags: [SaaS]
      summary: Public onboarding (guest) — create company + owner + subscription (+ optional invoice)
      description: |
        Guest endpoint for self-serve onboarding. Creates:
        - User (owner)
        - Company (tenant) + CompanyUser owner mapping
        - Subscription (trial by default; or pending_payment + invoice draft)
        Rate limited by throttle middleware.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_uuid, billing_cycle, consent_accepted, company, owner]
              properties:
                package_uuid: { type: string, format: uuid }
                billing_cycle: { type: string, enum: [monthly, yearly] }
                start_mode: { type: string, enum: [trial, pending_payment], nullable: true }
                consent_accepted:
                  type: boolean
                  description: Must be accepted (`true`) before onboarding can proceed.
                billingEmail: { type: string, format: email, nullable: true, maxLength: 255 }
                turnstile_token:
                  type: string
                  maxLength: 2048
                  nullable: true
                  description: Required when Turnstile is enabled on the server.
                website:
                  type: string
                  maxLength: 200
                  nullable: true
                  description: Honeypot field for bots. Must be empty.
                company:
                  type: object
                  required: [name, timezone, currency, country_code, address, city]
                  properties:
                    code:
                      type: string
                      maxLength: 100
                      pattern: '^[A-Za-z0-9_-]+$'
                      nullable: true
                      description: Optional. If omitted, server auto-generates a unique code.
                    name: { type: string, maxLength: 255 }
                    legal_name: { type: string, maxLength: 255, nullable: true }
                    timezone: { type: string, maxLength: 100 }
                    currency: { type: string, maxLength: 10 }
                    country_code: { type: string, maxLength: 10 }
                    contact_phone:
                      type: string
                      maxLength: 20
                      nullable: true
                      pattern: '^[0-9+\-\s().]{6,20}$'
                      description: Optional. Company contact phone for billing/support.
                    contact_person_name:
                      type: string
                      maxLength: 120
                      nullable: true
                      description: Optional. Sales follow-up contact person name.
                    contact_person_role:
                      type: string
                      maxLength: 120
                      nullable: true
                      description: Optional. Sales follow-up contact person role/title.
                    address:
                      type: string
                      maxLength: 500
                      description: Company address.
                    city:
                      type: string
                      maxLength: 120
                    postal_code:
                      type: string
                      maxLength: 12
                      nullable: true
                      pattern: '^[0-9]{3,12}$'
                      description: Optional. Postal code.
                owner:
                  type: object
                  required: [name, email, password, confirmPassword]
                  properties:
                    name: { type: string, minLength: 2, maxLength: 150, pattern: "^[A-Za-z][A-Za-z\\s'.-]{1,149}$" }
                    email: { type: string, format: email, maxLength: 255 }
                    phone:
                      type: string
                      maxLength: 20
                      nullable: true
                      pattern: '^[0-9+\-\s().]{6,20}$'
                      description: Optional. Owner phone.
                    password: { type: string, minLength: 8, maxLength: 64, pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d)[A-Za-z\\d@$!%*?&._-]{8,64}$' }
                    confirmPassword: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      company:
                        type: object
                        properties:
                          id: { type: integer }
                          code: { type: string }
                          name: { type: string }
                      owner:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          email: { type: string }
                      subscription:
                        type: object
                        properties:
                          id: { type: integer }
                          status: { type: string, enum: [trial, pending_payment] }
                          startsAt: { type: string, format: date-time }
                          endsAt: { type: string, format: date-time }
                          trialEndsAt: { type: string, format: date-time, nullable: true }
                          billingCycle: { type: string, enum: [monthly, yearly] }
                          amount: { type: number }
                          packageId: { type: string, format: uuid }
                          packageCode: { type: string }
                          packageName: { type: string }
                      invoice:
                        type: object
                        nullable: true
                        properties:
                          id: { type: integer }
                          invoiceNumber: { type: string, nullable: true }
                          issueDate: { type: string, format: date }
                          dueDate: { type: string, format: date }
                          amountDue: { type: number }
                          isPaid: { type: boolean }
                          status: { type: string }
                          billingTaxRateSnapshot: { type: number, nullable: true }
                          pricingBreakdown:
                            type: object
                            nullable: true
                            properties:
                              base_amount: { type: number, nullable: true }
                              subscription_tax_rate: { type: number, nullable: true }
                              subscription_tax_amount: { type: number, nullable: true }
                              total_amount: { type: number, nullable: true }
                              components:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    key: { type: string }
                                    label: { type: string }
                                    rate: { type: number }
                                    amount: { type: number }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

  /v1/hcm/settings:
    get:
      tags: [HCM]
      summary: Get settings by group
      security:
        - bearerAuth: []
      parameters:
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum: [general, prefix, business, localization, seo]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [HCM]
      summary: Save settings by group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, settings]
              properties:
                group:
                  type: string
                  enum: [general, prefix, business, localization, seo]
                settings:
                  type: object
                  additionalProperties: true
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/email-settings:
    get:
      tags: [HCM]
      summary: Get active email settings profile (global HCM admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active email profile
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      provider:
                        type: string
                        enum: [smtp, mailtrap]
                      fromAddress:
                        type: string
                        nullable: true
                        format: email
                      fromName:
                        type: string
                        nullable: true
                      smtp:
                        type: object
                        properties:
                          host:
                            type: string
                            nullable: true
                          port:
                            type: integer
                          encryption:
                            type: string
                            nullable: true
                            enum: [tls, ssl, none]
                          username:
                            type: string
                            nullable: true
                          passwordMasked:
                            type: string
                            nullable: true
                          configured:
                            type: boolean
                      mailtrap:
                        type: object
                        properties:
                          accountId:
                            type: integer
                            nullable: true
                          apiTokenMasked:
                            type: string
                            nullable: true
                          configured:
                            type: boolean
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    put:
      tags: [HCM]
      summary: Update active email settings profile (global HCM admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [smtp, mailtrap]
                fromAddress:
                  type: string
                  nullable: true
                  format: email
                fromName:
                  type: string
                  nullable: true
                smtp:
                  type: object
                  properties:
                    host:
                      type: string
                      nullable: true
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    encryption:
                      type: string
                      nullable: true
                      enum: [tls, ssl, none]
                    username:
                      type: string
                      nullable: true
                    password:
                      type: string
                      nullable: true
                mailtrap:
                  type: object
                  properties:
                    accountId:
                      type: integer
                      nullable: true
                      minimum: 1
                    apiToken:
                      type: string
                      nullable: true
      responses:
        '200':
          description: Updated email profile
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      provider:
                        type: string
                        enum: [smtp, mailtrap]
                      fromAddress:
                        type: string
                        nullable: true
                        format: email
                      fromName:
                        type: string
                        nullable: true
                      smtp:
                        type: object
                        properties:
                          host:
                            type: string
                            nullable: true
                          port:
                            type: integer
                          encryption:
                            type: string
                            nullable: true
                            enum: [tls, ssl, none]
                          username:
                            type: string
                            nullable: true
                          passwordMasked:
                            type: string
                            nullable: true
                          configured:
                            type: boolean
                      mailtrap:
                        type: object
                        properties:
                          accountId:
                            type: integer
                            nullable: true
                          apiTokenMasked:
                            type: string
                            nullable: true
                          configured:
                            type: boolean
                  meta:
                    type: object
                    properties:
                      updatedBy:
                        type: object
                        properties:
                          id:
                            type: integer
                            nullable: true
                          uuid:
                            type: string
                            nullable: true
                          email:
                            type: string
                            nullable: true
                            format: email
                      updatedAt:
                        type: string
                        nullable: true
                        format: date-time
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/hcm/email-settings/mailtrap-status:
    get:
      tags: [HCM]
      summary: Check Mailtrap connectivity and visible token metadata (global HCM admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mailtrap connectivity status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      provider:
                        type: string
                        example: mailtrap
                      accountId:
                        type: integer
                        nullable: true
                      credentialSource:
                        type: string
                        enum: [env, settings]
                      tokenConfigured:
                        type: boolean
                      tokenLast4:
                        type: string
                        nullable: true
                      connected:
                        type: boolean
                      visibleTokenCount:
                        type: integer
                      visibleTokens:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              nullable: true
                            name:
                              type: string
                              nullable: true
                            last4:
                              type: string
                              nullable: true
                            expiresAt:
                              type: string
                              nullable: true
                              format: date-time
                      error:
                        type: object
                        nullable: true
                        properties:
                          code:
                            type: string
                          message:
                            type: string
                      mode:
                        type: string
                        enum: [env, settings]
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/hcm/email-settings/test-connection:
    post:
      tags: [HCM]
      summary: Test SMTP or Mailtrap connectivity without persisting credentials (global HCM admin only, throttled 5 requests per minute)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [smtp, mailtrap]
                timeout:
                  type: integer
                  minimum: 1
                  maximum: 30
                smtp:
                  type: object
                  properties:
                    host:
                      type: string
                      nullable: true
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    encryption:
                      type: string
                      nullable: true
                      enum: [tls, ssl, none]
                    username:
                      type: string
                      nullable: true
                    password:
                      type: string
                      nullable: true
                mailtrap:
                  type: object
                  properties:
                    accountId:
                      type: integer
                      nullable: true
                      minimum: 1
                    apiToken:
                      type: string
                      nullable: true
      responses:
        '200':
          description: Connectivity probe result
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      provider:
                        type: string
                        enum: [smtp, mailtrap]
                      mode:
                        type: string
                        example: ephemeral
                      persisted:
                        type: boolean
                        nullable: true
                      accountId:
                        type: integer
                        nullable: true
                      tokenConfigured:
                        type: boolean
                        nullable: true
                      connected:
                        type: boolean
                      visibleTokenCount:
                        type: integer
                        nullable: true
                      visibleTokens:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              nullable: true
                            name:
                              type: string
                              nullable: true
                            last4:
                              type: string
                              nullable: true
                            expiresAt:
                              type: string
                              nullable: true
                              format: date-time
                      testedAt:
                        type: string
                        format: date-time
                      details:
                        type: object
                        nullable: true
                        additionalProperties: true
                      error:
                        type: object
                        nullable: true
                        properties:
                          code:
                            type: string
                            enum: [TIMEOUT, DNS_ERROR, CONNECTION_REFUSED, TLS_ERROR, AUTH_FAILED, CONNECTION_FAILED, CONFIGURATION_ERROR]
                          message:
                            type: string
                  meta:
                    type: object
                    properties:
                      lastTestStatus:
                        type: object
                        properties:
                          provider:
                            type: string
                            nullable: true
                          mode:
                            type: string
                            nullable: true
                          connected:
                            type: boolean
                          testedAt:
                            type: string
                            nullable: true
                            format: date-time
                          details:
                            type: object
                            nullable: true
                            additionalProperties: true
                          error:
                            type: object
                            properties:
                              code:
                                type: string
                                nullable: true
                              message:
                                type: string
                                nullable: true
                          updatedBy:
                            type: object
                            properties:
                              id:
                                type: integer
                                nullable: true
                              uuid:
                                type: string
                                nullable: true
                              email:
                                type: string
                                nullable: true
                                format: email
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/notifications/send-email:
    post:
      tags: [HCM]
      summary: Send a runtime email from admin compose UI (global HCM admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, message]
              properties:
                to:
                  type: string
                  format: email
                subject:
                  type: string
                  maxLength: 255
                message:
                  type: string
                  maxLength: 5000
      responses:
        '200':
          description: Email sent
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      to: { type: string, format: email }
                      subject: { type: string }
                      sentAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: Email send failed
          content:
            application/json:
              schema:
                type: object
                required: [success, error]
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code: { type: string, example: MAIL_ERROR }
                      message: { type: string }

  /webhooks/email-inbound:
    post:
      tags: [HCM]
      summary: Receive inbound email provider webhooks
      description: Public webhook endpoint secured by `X-Email-Inbound-Token` or `token` body field. Persists inbound email metadata as `email.inbound.received` in notification deliveries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                message_id:
                  type: string
                messageId:
                  type: string
                from:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                to:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                subject:
                  type: string
                text:
                  type: string
                html:
                  type: string
                received_at:
                  type: string
                  format: date-time
      parameters:
        - name: X-Email-Inbound-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Inbound email accepted or deduplicated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      duplicate:
                        type: boolean
                      deliveryId:
                        type: integer
                      messageId:
                        type: string
                        nullable: true
        '401':
          description: Invalid webhook token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook token not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks/email-delivery-status:
    post:
      tags: [HCM]
      summary: Receive outbound email delivery status webhooks
      description: Public webhook endpoint secured by `X-Email-Delivery-Token` or `token` body field. Updates outbound compose email delivery status by delivery UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                delivery_uuid:
                  type: string
                deliveryUuid:
                  type: string
                notification_uuid:
                  type: string
                notificationUuid:
                  type: string
                event:
                  type: string
                status:
                  type: string
                reason:
                  type: string
                error:
                  type: string
                message_id:
                  type: string
      parameters:
        - name: X-Email-Delivery-Token
          in: header
          required: false
          schema:
            type: string
        - name: X-Arcav-Delivery-UUID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Delivery status accepted and applied
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deliveryId:
                        type: integer
                      deliveryUuid:
                        type: string
                      event:
                        type: string
                      status:
                        type: string
                        enum: [sent, delivered, deferred, dropped, failed]
        '401':
          description: Invalid webhook token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Delivery UUID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Delivery UUID missing from payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook token not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

