    post:
      tags: [Payroll]
      summary: Void finalized payroll run (HCM admin)
      description: |
        Menandai run `finalized` menjadi `void` selama belum ada line dengan `paymentStatus = paid`.
        Jika run ini adalah finalized terakhir pada periode tersebut, status periodenya dikembalikan ke `open`.
        Runtime saat ini menerima identifier numeric legacy pada path `{id}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      payrollPeriodId:
                        type: integer
                        example: 1
                      purpose:
                        type: string
                        enum: [monthly, thr, pkwt_compensation]
                        example: monthly
                      status:
                        type: string
                        enum: [draft, finalized, void]
                        example: void
                      calculatedAt:
                        type: string
                        format: date-time
                        nullable: true
                      finalizedAt:
                        type: string
                        format: date-time
                        nullable: true
                      finalizedByUserId:
                        type: integer
                        nullable: true
                      period:
                        type: object
                        nullable: true
                        properties:
                          id:
