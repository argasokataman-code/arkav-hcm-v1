        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/pkwt-compensations/post-payroll:
    post:
      tags: [Payroll]
      summary: Create or rebuild standalone PKWT compensation draft payroll (HCM admin)
      description: |
        Membuat atau membangun ulang payroll run draft dengan `purpose=pkwt_compensation` untuk periode terpilih.
        Setelah draft terbentuk, pembayaran dilakukan melalui endpoint generic `POST /payroll-runs/{id}/disburse`.
        Saat fitur reconciliation enforcement aktif, endpoint juga dapat mengembalikan
        `EXPORT_RECON_REQUIRED` / `EXPORT_RECON_EXPIRED` / `EXPORT_RECON_SCOPE_MISMATCH` / `EXPORT_RECON_STALE_DATA`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodYear, periodMonth]
              properties:
                periodYear: { type: integer, minimum: 2000, maximum: 2100 }
                periodMonth: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      period:
                        type: object
                        properties:
                          id: { type: integer, example: 9 }
                          periodYear: { type: integer, example: 2026 }
                          periodMonth: { type: integer, example: 4 }
                          status: { type: string, enum: [open, posted], example: open }
                      run:
                        type: object
                        properties:
                          id: { type: integer, example: 17 }
                          purpose: { type: string, enum: [pkwt_compensation], example: pkwt_compensation }
                          status: { type: string, enum: [draft, finalized], example: draft }
                          finalizedAt: { type: string, format: date-time, nullable: true }
                          period:
                            type: object
                            nullable: true
                            properties:
                              id: { type: integer, example: 9 }
                              periodYear: { type: integer, example: 2026 }
                              periodMonth: { type: integer, example: 4 }
                              status: { type: string, enum: [open, posted], example: open }
                          payment:
                            type: object
                            properties:
                              status: { type: string, enum: [unpaid, partial, paid], example: unpaid }
                              employeeCount: { type: integer, example: 3 }
                              paidEmployeeCount: { type: integer, example: 0 }
                              paidUserIds:
                                type: array
                                items: { type: integer }
                              paidAt: { type: string, format: date-time, nullable: true }
                              gatewayReference: { type: string, nullable: true }
                      preview:
                        type: object
                        properties:
                          period:
                            type: object
                            properties:
                              periodYear: { type: integer, example: 2026 }
                              periodMonth: { type: integer, example: 4 }
                          summary:
                            type: object
                            properties:
                              totalEmployees: { type: integer, example: 3 }
                              eligibleEmployees: { type: integer, example: 3 }
                              grandTotal: { type: number, format: float, example: 12500000 }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422':
          description: Validation or domain error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [PKWT_COMPENSATION_EMPTY, PKWT_COMPENSATION_COMPONENT_MISSING, PKWT_COMPENSATION_FINALIZED_EXISTS, EXPORT_RECON_REQUIRED, EXPORT_RECON_EXPIRED, EXPORT_RECON_SCOPE_MISMATCH, EXPORT_RECON_STALE_DATA]
                      message:
                        type: string
  /v1/hcm/payroll/pkwt-calculate:
    post:
      tags: [Payroll]
      summary: Estimate PKWT compensation for one contract (HCM admin)
      description: |
        Kalkulator cepat kompensasi PKWT berdasarkan tanggal mulai/akhir kontrak dan upah bulanan.
        Cocok untuk pengecekan HR sebelum review payroll/off-cycle.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractStartDate, contractEndDate, baseMonthlySalary]
              properties:
                contractStartDate: { type: string, format: date }
                contractEndDate: { type: string, format: date }
                baseMonthlySalary: { type: number, minimum: 0 }
                fixedMonthlyAllowance: { type: number, minimum: 0, nullable: true }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-calculate:
    post:
      tags: [Payroll]
      summary: Estimate THR gross (Permenaker 6/2016 pro rata, HCM admin)
      description: |
        Estimasi THR bruto; bukan slip final. PPh 21 TER di luar endpoint ini.
        Upah acuan = gaji pokok + tunjangan tetap bulanan (`fixedMonthlyAllowance`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joinDate, cutoffDate, baseMonthlySalary]
              properties:
                joinDate: { type: string, format: date }
                cutoffDate: { type: string, format: date }
                baseMonthlySalary: { type: number, minimum: 0 }
                fixedMonthlyAllowance: { type: number, minimum: 0, nullable: true }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-settings:
    get:
      tags: [Payroll]
      summary: List THR yearly settings (HCM admin)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/hcm/payroll/thr-settings/{calendarYear}:
    put:
      tags: [Payroll]
      summary: Upsert THR settings for a calendar year (HCM admin)
      security:
        - bearerAuth: []
      parameters:
        - name: calendarYear
          in: path
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eidDate]
              properties:
                eidDate: { type: string, format: date }
                paymentDate: { type: string, format: date, nullable: true }
                calculationCutoffDate: { type: string, format: date, nullable: true }
                notes: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch:
    get:
      tags: [Payroll]
      summary: THR mass batch for a calendar year (HCM admin)
      description: |
        Draft batch terbaru atau batch assigned terakhir untuk `calendarYear`, beserta `lines[]`.
        Setiap elemen `lines[]` menyertakan `bankName` dan `bankAccountNo` (dari profil karyawan; nullable) untuk verifikasi sebelum disburse.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarYear
          in: query
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/generate:
    post:
      tags: [Payroll]
      summary: Regenerate THR draft list for a year (HCM admin)
      description: |
        Membutuhkan `calculationCutoffDate` di thr-settings tahun tersebut. `422` THR_SETUP_CUTOFF_REQUIRED / THR_YEAR_ALREADY_ASSIGNED.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calendarYear]
              properties:
                calendarYear: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/disburse:
    post:
      tags: [Payroll]
      summary: Eksekusi pembayaran THR via payment gateway (subset userIds, HCM admin)
      description: |
        Batch harus `draft`. Memanggil driver disbursement (`hcm.thr_disbursement_driver`, default stub).
        Baris `paid` dilewati. Sukses → `paymentStatus=paid`, generate slip PDF; gagal → `failed` + alasan (retry dari UI).
        Saat fitur reconciliation enforcement aktif, endpoint juga dapat mengembalikan
        `EXPORT_RECON_REQUIRED` / `EXPORT_RECON_EXPIRED` / `EXPORT_RECON_SCOPE_MISMATCH` / `EXPORT_RECON_STALE_DATA`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, userIds]
              properties:
                batchId: { type: integer }
                userIds:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/post-payroll:
    post:
      tags: [Payroll]
      summary: Posting batch THR ke run payroll final (HCM admin)
      description: |
        Membutuhkan semua baris eligible THR>0 sudah `paid`. `paymentDate` di thr-settings. Run `purpose=thr` final; batch jadi `assigned`.
        `422` THR_POST_UNPAID_PAYABLE_LINES jika masih ada eligible belum paid.
        Saat fitur reconciliation enforcement aktif, endpoint juga dapat mengembalikan
        `EXPORT_RECON_REQUIRED` / `EXPORT_RECON_EXPIRED` / `EXPORT_RECON_SCOPE_MISMATCH` / `EXPORT_RECON_STALE_DATA`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId]
              properties:
                batchId: { type: integer }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/send-slip:
    post:
      tags: [Payroll]
      summary: Tandai slip THR sudah dikirim (bulk, HCM admin)
      description: |
        Mencatat `slip_notify_sent_at` untuk `lineIds` di `batchId`. Integrasi email/WA dapat ditambahkan di belakang endpoint ini.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, lineIds]
              properties:
                batchId: { type: integer }
                lineIds:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/thr-batch/lines/{line}/slip:
    get:
      tags: [Payroll]
      summary: Unduh/preview PDF slip THR untuk satu baris batch
      description: |
        **HCM admin** semua baris. **Karyawan** hanya jika `line` milik user login (`user_id` sama).
      security:
        - bearerAuth: []
      parameters:
        - name: line
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: application/pdf
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: THR_SLIP_NOT_FOUND / THR_SLIP_FILE_MISSING }
  /v1/reconciliation/exports:
    post:
      tags: [Reporting]
      summary: Create export reconciliation evidence (HCM admin)
      description: |
        Menyimpan evidence export untuk gate aksi berisiko. Endpoint ini membutuhkan tenant context aktif.

        **Kompatibilitas UI:** klien payroll/THR/PKWT mengirim `format` (alias `fileFormat`) dan `filterPayload`.
        Jika `filePath` tidak dikirim dan `fileFormat`/`format` adalah **`csv`**, server akan **menulis file CSV evidence**
        ke disk `local` pada path `reconciliation/generated/...` lalu menyimpan evidence.

        Untuk `xlsx` / `pdf`, `filePath` tetap **wajib** (server tidak auto-generate).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [featureKey, actionKey, scopeRef]
              properties:
                featureKey:
                  type: string
                  enum: [payroll_run, thr_batch, pkwt_compensation, invoice, payment]
                actionKey:
                  type: string
                  enum: [finalize, disburse, post_payroll, mark_paid, verify]
                scopeRef: { type: string }
                fileFormat: { type: string, enum: [csv, xlsx, pdf] }
                format:
                  description: Alias untuk `fileFormat` (kompatibilitas klien).
                  type: string
                  enum: [csv, xlsx, pdf]
                filePath:
                  description: Path relatif di disk `local`. Wajib untuk `xlsx|pdf`; opsional untuk `csv` (auto-generate bila kosong).
                  type: string
                rowCount:
                  description: Opsional; jika tidak dikirim akan diinfer dari `filterPayload` (mis. `lineIds` / `periods`) atau 0.
                  type: integer
                  minimum: 0
                filterPayload:
                  type: object
                  additionalProperties: true
                filters:
                  description: Alias untuk `filterPayload` (kompatibilitas kontrak awal).
                  type: object
                  additionalProperties: true
