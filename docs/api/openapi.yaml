  /v1/hcm/payroll-runs/{id}/disburse:
    post:
      tags: [Payroll]
      summary: Disburse monthly payroll via gateway (HCM admin)
      description: |
        Menjalankan pembayaran gateway untuk subset `userIds` yang dipilih. Jika run masih `draft`, API akan
        otomatis memfinalkan run dan menandai periodenya sebagai `posted` sebelum menulis status pembayaran per karyawan.
        Pemanggilan berulang aman/idempotent: user yang sudah `paid` akan dilewati.
        Hanya user dengan total net pay `> 0` yang eligible untuk didisburse.
        Saat fitur reconciliation enforcement aktif, endpoint juga dapat mengembalikan
        `EXPORT_RECON_REQUIRED` / `EXPORT_RECON_EXPIRED` / `EXPORT_RECON_SCOPE_MISMATCH` / `EXPORT_RECON_STALE_DATA`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Optional subset of employee user UUIDs to disburse. Required when applyAll is not true.
                applyAll:
                  type: boolean
                  description: Set true to disburse all eligible employees in the run explicitly.
      responses:
        '200':
          description: Gateway disbursement processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      run:
                        type: object
                      selectedUserIds:
                        type: array
                        items: { type: integer }
                      ineligibleUserIds:
                        type: array
                        items: { type: integer }
                      skippedAlreadyPaidUserIds:
                        type: array
                        items: { type: integer }
                      gatewayReference:
                        type: string
                        nullable: true
                      payment:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [unpaid, partial, paid]
                          employeeCount:
                            type: integer
                          paidEmployeeCount:
                            type: integer
                          paidUserIds:
                            type: array
                            items: { type: integer }
                          paidAt:
                            type: string
                            format: date-time
                            nullable: true
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422':
          description: Validation/domain error termasuk PAYROLL_DISBURSE_NO_EMPLOYEES, PAYROLL_RUN_EMPTY, PAYROLL_FINALIZED_EXISTS, EXPORT_RECON_REQUIRED, EXPORT_RECON_EXPIRED, EXPORT_RECON_SCOPE_MISMATCH, EXPORT_RECON_STALE_DATA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
