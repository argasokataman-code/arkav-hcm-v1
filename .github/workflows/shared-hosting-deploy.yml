name: Deploy to Shared Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'release/shared-hosting/**'
      - '.github/workflows/shared-hosting-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Artifact to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for production artifact
        run: |
          ARTIFACT=$(ls -t release/shared-hosting/shared-hosting-artifact-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "❌ ERROR: No production artifact found in release/shared-hosting/"
            echo ""
            echo "📋 LOCAL BUILD REQUIRED before push:"
            echo "   cd backend"
            echo "   composer install --no-dev"
            echo "   npm ci && npm run build"
            echo "   cd .."
            echo "   bash scripts/shared-hosting-package-local.sh"
            echo "   git add release/ && git commit && git push"
            echo ""
            exit 1
          fi
          echo "✅ Found artifact: $ARTIFACT"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy artifact to server
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          cd release/shared-hosting
          ARTIFACT=$(ls -t shared-hosting-artifact-*.tar.gz | head -1)
          echo "📦 Uploading: $ARTIFACT"
          scp -P "$SSH_PORT" -i ~/.ssh/deploy_key "$ARTIFACT" "$SSH_USER@$SSH_HOST:/home/$SSH_USER/public_html/hr.jogjatourdrive.com/"
          
          echo "🚀 Extracting and deploying..."
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" << EOF
          set -euo pipefail
          cd /home/$SSH_USER/public_html/hr.jogjatourdrive.com
          ARTIFACT=\$(ls -t shared-hosting-artifact-*.tar.gz | head -1)
          tar -xzf "\$ARTIFACT"
          bash scripts/shared-hosting-deploy-easy.sh
          echo "✅ Deploy complete!"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
