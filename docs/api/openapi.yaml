                      message:
                        type: string
  /v1/hcm/payroll-runs/{id}/disburse:
    post:
      tags: [Payroll]
      summary: Mark monthly payroll paid manually (HCM admin)
      description: |
        Mencatat penyelesaian pembayaran manual eksternal untuk subset `userIds` yang dipilih. Jika run masih `draft`, API akan
        otomatis memfinalkan run dan menandai periodenya sebagai `posted` sebelum menulis status pembayaran per karyawan.
        Pemanggilan berulang aman/idempotent: user yang sudah `paid` akan dilewati.
        Hanya user dengan total net pay `> 0` yang eligible untuk ditandai paid.
        Evidence export reconciliation runtime aktif memakai schema payment-ready seragam dengan kolom
        `payroll_type`, `reference_period`, `reference_id`, `employee_id`, `employee_name`, `bank_name`,
        `account_number`, `account_holder_name`, `bank_branch`, `gross_total`, `overtime_total`,
        `deductions_total`, `transfer_amount`, `bank_data_status`, `dataset_checksum`.
        Saat fitur reconciliation enforcement aktif, endpoint juga dapat mengembalikan
        `EXPORT_RECON_REQUIRED` / `EXPORT_RECON_EXPIRED` / `EXPORT_RECON_SCOPE_MISMATCH` / `EXPORT_RECON_STALE_DATA`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    oneOf:
                      - { type: integer }
                      - { type: string, format: uuid }
                  description: Optional subset of employee identifiers to mark paid. Numeric `users.id` is the primary path; UUID fallback remains supported.
                applyAll:
                  type: boolean
                  description: Set true to mark all eligible employees in the run as paid explicitly.
      responses:
        '200':
          description: Manual payroll payment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      run:
                        type: object
                      selectedUserIds:
                        type: array
                        items: { type: integer }
                      ineligibleUserIds:
                        type: array
                        items: { type: integer }
                      skippedAlreadyPaidUserIds:
                        type: array
                        items: { type: integer }
                      gatewayReference:
                        type: string
                        nullable: true
                      completionMode:
                        type: string
                        example: manual_external
                      payment:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [unpaid, partial, paid]
                          employeeCount:
                            type: integer
                          paidEmployeeCount:
                            type: integer
                          paidUserIds:
                            type: array
                            items: { type: integer }
                          paidAt:
                            type: string
                            format: date-time
                            nullable: true
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422':
          description: Validation/domain error termasuk PAYROLL_DISBURSE_NO_EMPLOYEES, PAYROLL_RUN_EMPTY, PAYROLL_FINALIZED_EXISTS, EXPORT_RECON_REQUIRED, EXPORT_RECON_EXPIRED, EXPORT_RECON_SCOPE_MISMATCH, EXPORT_RECON_STALE_DATA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
