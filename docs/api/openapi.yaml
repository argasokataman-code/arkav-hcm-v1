      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/saas/subscription-change-requests:
    get:
      tags: [SaaS]
      summary: List all tenant plan change requests (primary super-admin code-1 only) — F4
      security:
        - bearerAuth: []
