                  enum: [active, trial, pending_payment, inactive, expired, cancelled, suspended]
                starts_at: { type: string, format: date }
                ends_at: { type: string, format: date, nullable: true }
                trial_ends_at:
                  type: string
                  format: date
                  nullable: true
                  description: Required when resulting status is trial; send null to clear when leaving trial
                auto_renew: { type: boolean }
                billing_cycle: { type: string, enum: [monthly, yearly] }
                amount: { type: number, minimum: 0, nullable: true }
