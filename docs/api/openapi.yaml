        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/hcm/payroll/settings:
    get:
      tags: [Payroll]
      summary: Get monthly payroll settings (HCM admin)
      description: |
        Returns tenant-scoped monthly payroll payday and cutoff settings for the active company context.
        Catatan kontrak: tanggal resolved payday/cutoff yang authoritative untuk eksekusi payroll tersedia di
        `policySnapshot` pada payload run/period setelah draft dihitung server-side.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      paydayDay: { type: integer, minimum: 1, maximum: 31, example: 28 }
                      cutoffOffsetDays: { type: integer, minimum: 0, maximum: 15, example: 3 }
                      payrollTimezone: { type: string, example: Asia/Jakarta }
                      disburseBeforePaydayAllowed: { type: boolean, example: false }
                      paydayHolidayStrategy: { type: string, enum: [previous_working_day, next_working_day, exact_calendar_day], example: previous_working_day }
        '400':
          description: Tenant context missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code: { type: string, example: TENANT_REQUIRED }
                      message: { type: string, example: Active company context is required. }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    put:
      tags: [Payroll]
      summary: Update monthly payroll settings (HCM admin)
      description: |
        Saves tenant-scoped monthly payroll payday and cutoff settings for the active company context.
        Perubahan setting tenant tidak mengubah snapshot run existing; policy baru akan efektif setelah draft direbuild
        sehingga `policySnapshot` run terbarui.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                paydayDay: { type: integer, minimum: 1, maximum: 31 }
                cutoffOffsetDays: { type: integer, minimum: 0, maximum: 15 }
                payrollTimezone: { type: string, example: Asia/Jakarta }
                disburseBeforePaydayAllowed: { type: boolean }
                paydayHolidayStrategy: { type: string, enum: [previous_working_day, next_working_day, exact_calendar_day] }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Payroll settings saved. }
                  data:
                    type: object
                    properties:
                      paydayDay: { type: integer, minimum: 1, maximum: 31, example: 28 }
                      cutoffOffsetDays: { type: integer, minimum: 0, maximum: 15, example: 3 }
                      payrollTimezone: { type: string, example: Asia/Jakarta }
                      disburseBeforePaydayAllowed: { type: boolean, example: false }
                      paydayHolidayStrategy: { type: string, enum: [previous_working_day, next_working_day, exact_calendar_day], example: previous_working_day }
        '400':
          description: Tenant context missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code: { type: string, example: TENANT_REQUIRED }
                      message: { type: string, example: Active company context is required. }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll-periods/{id}/calculate-draft:
    post:
      tags: [Payroll]
      summary: Rebuild draft payroll run (HCM admin)
      description: |
        Membuat draft payroll untuk periode. Jika draft `monthly` sudah ada, endpoint mengembalikan draft existing (idempotent, tanpa rebuild ulang).
        `422` jika periode sudah punya run `finalized` (`PAYROLL_PERIOD_FINALIZED`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
