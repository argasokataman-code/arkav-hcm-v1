# Arsitektur deploy: volume-based (tidak ada image build/push per commit)
# Kode di-deploy via git clone/pull di server. Vendor & node_modules persist di named volume.
# Estimasi waktu deploy: ~2-4 menit (vs ~15-20 menit sebelumnya).

name: Deploy Arkav HCM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy runtime guard
        run: bash scripts/check-deploy-runtime-guard.sh

      - name: Deploy to server via SSH
        env:
          REPO_URL: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} \
            REPO_URL="$REPO_URL" \
            bash << 'EOF'
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/arkav-hcm}"

            # --- 1. Pastikan host storage dirs ada (runtime guard wajib) ---
            mkdir -p /data/code/storage/logs || true
            mkdir -p /data/code/storage/framework/cache/data || true
            mkdir -p /data/code/storage/framework/sessions || true
            mkdir -p /data/code/storage/framework/views || true
            mkdir -p /data/code/storage/app/public || true
            mkdir -p /data/code/storage/app/private || true

            # --- 2. Pastikan deploy dir writable oleh user SSH saat ini ---
            mkdir -p "$DEPLOY_DIR"
            if [ ! -w "$DEPLOY_DIR" ]; then
              echo "[deploy] ERROR: DEPLOY_DIR is not writable: $DEPLOY_DIR"
              exit 1
            fi

            # --- 3. Clone jika belum ada, init in-place jika dir ada tapi bukan repo, pull jika sudah repo ---
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              if [ -d "$DEPLOY_DIR" ] && [ "$(ls -A "$DEPLOY_DIR" 2>/dev/null)" ]; then
                echo "[deploy] $DEPLOY_DIR exists but is not a git repo — initializing in-place..."
                cd "$DEPLOY_DIR"
                git init
                git remote add origin "$REPO_URL"
              else
                echo "[deploy] First deploy: git clone..."
                git clone "$REPO_URL" "$DEPLOY_DIR"
                cd "$DEPLOY_DIR"
              fi
            else
              cd "$DEPLOY_DIR"
              git remote set-url origin "$REPO_URL"
            fi
            # Sync ke latest main (berlaku untuk semua kasus di atas)
            git fetch origin main
            git reset --hard origin/main

            cd "$DEPLOY_DIR"

            # --- Compose command compatibility: plugin vs legacy binary ---
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "[deploy] ERROR: docker compose/docker-compose not found on server." >&2
              exit 1
            fi

            # --- 3. PHP deps ke named volume (cepat: hanya download package baru) ---
            echo "[deploy] composer install (diff only)..."
            $COMPOSE_CMD run --rm --no-deps arkav-hcm \
              bash -c "cd /app/backend && composer install --no-dev --optimize-autoloader --ignore-platform-req=php --no-scripts && php artisan package:discover --ansi"

            # --- 4. Node deps + Vite build ke named volume (cepat: npm ci diff) ---
            echo "[deploy] npm ci + npm run build..."
            $COMPOSE_CMD run --rm --no-deps arkav-hcm \
              bash -c "cd /app/backend && npm ci && npm run build"

            # --- 5. Restart container (kode baru terbaca via volume, no image rebuild) ---
            echo "[deploy] docker-compose up -d..."
            $COMPOSE_CMD up -d --force-recreate arkav-hcm

            # --- 6. Runtime dirs + artisan commands ---
            sleep 5
            $COMPOSE_CMD exec -T arkav-hcm bash -c "cd /app/backend \
              && mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public storage/app/private bootstrap/cache \
              && chmod -R ug+rwX storage bootstrap/cache \
              && php artisan config:clear \
              && php artisan view:clear \
              && php artisan config:cache \
              && php artisan route:cache \
              && php artisan view:cache \
              && php artisan migrate --force"

            # --- 7. Health check (backend + frontend) ---
            backend_ok=false
            frontend_ok=false
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8007/health >/dev/null 2>&1 && backend_ok=true
              curl -fsS http://127.0.0.1:5179/ >/dev/null 2>&1 && frontend_ok=true
              [[ "$backend_ok" == true && "$frontend_ok" == true ]] && break
              sleep 2
            done

            if [[ "$backend_ok" != true || "$frontend_ok" != true ]]; then
              echo "[deploy] Health check FAILED: backend=$backend_ok frontend=$frontend_ok" >&2
              $COMPOSE_CMD logs --tail 300 arkav-hcm || true
              exit 1
            fi

            echo "[deploy] Deploy successful!"
          EOF
