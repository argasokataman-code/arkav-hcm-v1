name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.2, 8.3]
      fail-fast: false

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: arcav_hcm_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl
          coverage: pcov
          ini-values: pcov.directory=app
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run database migrations
        working-directory: backend
        run: php artisan migrate --force --env=testing
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: arcav_hcm_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Run PHPUnit tests with JUnit output
        working-directory: backend
        id: phpunit
        continue-on-error: true
        run: php artisan test --env=testing --log-junit=test-results.xml --coverage-clover=coverage.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: arcav_hcm_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.php }}
          path: backend/coverage.xml
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.php }}
          path: backend/test-results.xml
          retention-days: 7

      - name: Generate QA failure report
        if: steps.phpunit.conclusion == 'failure' || steps.phpunit.outcome == 'failure'
        id: qa-report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('backend/test-results.xml', 'utf8');

            // Simple JUnit parser – extract failures
            const failures = [];
            const testMatch = /<testcase[^>]*name="([^"]+)"[^>]*class="([^"]+)"[^>]*>([\s\S]*?)<\/testcase>/g;
            let match;
            while ((match = testMatch.exec(xml)) !== null) {
              const body = match[3];
              if (body.includes('<failure') || body.includes('<error')) {
                const name = match[1];
                const cls = match[2];
                const errMatch = body.match(/<failure[^>]*message="([^"]*)"/) || body.match(/<error[^>]*message="([^"]*)"/);
                const traceMatch = body.match(/<failure[^>]*>([\s\S]*?)<\/failure>/) || body.match(/<error[^>]*>([\s\S]*?)<\/error>/);
                const details = traceMatch ? traceMatch[1].trim() : '';
                const lines = details.split('\n').slice(0, 20).join('\n');

                // Map test class → feature domain
                const featureMap = {
                  'HcmEmployee': 'Employee Management',
                  'HcmTermination': 'Termination',
                  'HcmTaxGovernance': 'Tax Governance',
                  'Auth': 'Authentication',
                  'Leave': 'Leave Management',
                  'Attendance': 'Attendance',
                  'Payroll': 'Payroll',
                  'Dashboard': 'Dashboard',
                  'Bpjs': 'BPJS Governance',
                  'Performance': 'Performance',
                  'Package': 'Package/Billing',
                  'UserManagement': 'User Management',
                  'Allowance': 'Allowance Governance',
                };
                let feature = 'Unknown';
                for (const [key, val] of Object.entries(featureMap)) {
                  if (cls.includes(key)) { feature = val; break; }
                }

                // Derive reproduction steps from test method name
                const steps = name
                  .replace(/^test_?/, '')
                  .replace(/_/g, ' ')
                  .replace(/\bis\b/g, 'is')
                  .replace(/\bwhen\b/g, 'when')
                  .replace(/\bcan\b/g, 'can');

                failures.push({
                  feature,
                  test: `${cls}::${name}`,
                  message: errMatch ? errMatch[1] : 'Unknown error',
                  trace: lines,
                  reproduction: `1. Prepare test environment: ${feature}\n2. Execute test: ${name}\n3. Assert: ${steps}`,
                });
              }
            }

            if (failures.length === 0) {
              console.log('No failures found in JUnit XML');
              return;
            }

            // Build markdown report
            let report = `## 🔴 QA Failure Report\n\n`;
            report += `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`;
            report += `**Branch:** ${context.ref}\n`;
            report += `**Commit:** ${context.sha}\n`;
            report += `**Time:** ${new Date().toISOString()}\n\n`;
            report += `---\n\n`;

            for (const f of failures) {
              report += `### 🎯 ${f.feature}\n\n`;
              report += `**Test:** \`${f.test}\`\n\n`;
              report += `**Error:**\n\`\`\`\n${f.message}\n\`\`\`\n\n`;
              report += `**Stack Trace (top 20):**\n\`\`\`\n${f.trace}\n\`\`\`\n\n`;
              report += `**Reproduction Steps:**\n${f.reproduction}\n\n`;
              report += `---\n\n`;
            }

            report += `_Auto-generated by CI pipeline._`;

            // Create GitHub Issue
            const title = `🧪 Test Failure Report (${new Date().toLocaleDateString('id-ID')})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: report,
              labels: ['bug', 'ci-test-failure'],
            });

            console.log(`Created issue with ${failures.length} failure(s)`);
            core.setOutput('issue-count', failures.length.toString());

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npx vitest run
