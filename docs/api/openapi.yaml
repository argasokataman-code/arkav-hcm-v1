      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      run:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 5
                          payrollPeriodId:
                            type: integer
                            example: 1
                          purpose:
                            type: string
                            enum: [monthly, thr]
                            example: monthly
                          status:
                            type: string
                            enum: [draft, finalized]
                            example: draft
                          calculatedAt:
                            type: string
                            format: date-time
                            nullable: true
                          finalizedAt:
                            type: string
                            format: date-time
                            nullable: true
                          finalizedByUserId:
                            type: integer
                            nullable: true
                          period:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: integer
                              periodYear:
                                type: integer
                              periodMonth:
                                type: integer
                              status:
                                type: string
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            userId:
                              type: integer
                            salaryComponentId:
                              type: integer
                              nullable: true
                            componentCode:
                              type: string
                              nullable: true
                            componentName:
                              type: string
                              nullable: true
                            kind:
                              type: string
