        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/hcm/attendance/admin/record:
    put:
      tags: [Attendance]
      summary: Admin upsert attendance record (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, workDate]
              properties:
                userId:
                  type: integer
                  description: Active contract uses users.id.
                workDate:
                  type: string
                  format: date
                checkInTime:
                  type: string
                  nullable: true
                  pattern: '^\\d{2}:\\d{2}$'
                checkOutTime:
                  type: string
                  nullable: true
                  pattern: '^\\d{2}:\\d{2}$'
                breakMinutes:
                  type: integer
                  minimum: 0
                  maximum: 720
                lateMinutes:
                  type: integer
                  minimum: 0
                  maximum: 1440
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
