openapi: 3.0.3
info:
  title: Arcav HCM Phase 1 API
  version: 1.0.0
  description: |
    Microservice-style contract for Identity, Core HCM, and Leave domains.
    Implementasi Laravel saat ini menggabungkan banyak endpoint leave/attendance/shift di prefix `/v1/hcm`.
    Lihat `backend/routes/api.php` dan `docs/planning/implementation-status.md` bila path di bawah belum tercantum di file ini.
servers:
  # Local backend (Laravel artisan serve via ./run.sh)
  - url: http://127.0.0.1:8007
    description: Local backend (recommended for Swagger Try it out)
  # Local frontend proxy (Node) - optional, may require CORS depending on setup
  - url: http://127.0.0.1:5179
    description: Local frontend proxy (optional)
  - url: https://api.example.com
    description: Production (placeholder)
tags:
  - name: Identity
  - name: HCM
  - name: Tickets
  - name: Attendance
  - name: Leave
  - name: Overtime
  - name: Payroll
  - name: Holidays
  - name: Training
  - name: Performance
  - name: Asset Management
  - name: Promotion
  - name: Resignation
  - name: Termination
  - name: SaaS
  - name: User Management
  - name: Reporting
paths:
  /v1/identity/auth/register:
    post:
      tags: [Identity]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/identity/auth/login:
    post:
      tags: [Identity]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /v1/identity/auth/logout:
    post:
      tags: [Identity]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v1/identity/auth/me:
    get:
      tags: [Identity]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/hcm/departments:
    get:
      tags: [HCM]
      summary: List departments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [HCM]
      summary: Create department
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpsertRequest'
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/hcm/departments/{id}:
    put:
      tags: [HCM]
      summary: Update department
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpsertRequest'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/hcm/designations:
    get:
      tags: [HCM]
      summary: List designations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [HCM]
      summary: Create designation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignationUpsertRequest'
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/hcm/designations/{id}:
    put:
      tags: [HCM]
      summary: Update designation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignationUpsertRequest'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/hcm/employees:
    get:
      tags: [HCM]
      summary: List employees
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DepartmentId'
        - $ref: '#/components/parameters/DesignationId'
        - $ref: '#/components/parameters/EmploymentStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeDirectoryRow'
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      perPage: { type: integer }
                      total: { type: integer }
                      summary:
                        type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [HCM]
      summary: Create employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/hcm/employees/{id}:
    get:
      tags: [HCM]
      summary: Get employee detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [HCM]
      summary: Update employee
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/hcm/employees/bulk-template:
    get:
      tags: [HCM]
      summary: Download employee bulk import template
      security:
        - bearerAuth: []
      responses:
        '200':
          description: XLSX template file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /v1/hcm/employees/bulk-upload:
    post:
      tags: [HCM]
      summary: Bulk create/update employees from spreadsheet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Bulk import applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      createdRows: { type: integer }
                      updatedRows: { type: integer }
                      failedRows: { type: integer }
                      errors:
                        type: array
                        items: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Validation failure; import is rolled back all-or-nothing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # -------------------------
  # User Management (implemented under /v1/hcm/user-management)
  # -------------------------
  /v1/hcm/user-management/users:
    get:
      tags: [User Management]
      summary: List users (admin only, tenant-scoped)
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive, all] } }
        - { name: roleCode, in: query, required: false, schema: { type: string, maxLength: 80 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [User Management]
      summary: Create user (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                roleCodes:
                  type: array
                  items: { type: string }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/users/export:
    get:
      tags: [User Management]
      summary: Export user list as CSV (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/hcm/user-management/users/{id}:
    get:
      tags: [User Management]
      summary: User detail with role assignments and effective permissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [User Management]
      summary: Update user profile/status (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/roles:
    get:
      tags: [User Management]
      summary: List roles (admin only)
      security:
        - bearerAuth: []
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [global, company] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive, archived, all] } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [User Management]
      summary: Create role (admin only)
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/roles/{id}:
    put:
      tags: [User Management]
      summary: Update role (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [User Management]
      summary: Delete or archive role (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/permissions:
    get:
      tags: [User Management]
      summary: List permissions (admin only)
      security:
        - bearerAuth: []
      parameters:
        - { name: module, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/hcm/user-management/roles/{id}/permissions:sync:
    post:
      tags: [User Management]
      summary: Replace role permissions with provided permission codes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/users/{id}/roles:
    get:
      tags: [User Management]
      summary: List role assignments for a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      tags: [User Management]
      summary: Assign role to user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/users/{id}/roles/{assignmentId}:
    delete:
      tags: [User Management]
      summary: Revoke role assignment from user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - { name: assignmentId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # -------------------------
  # Reporting Snapshots (implemented under /v1/hcm/reports/snapshots)
  # -------------------------
  /v1/hcm/reports/snapshots:
    post:
      tags: [Reporting]
      summary: Generate report snapshot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportType, periodStart, periodEnd]
              properties:
                reportType:
                  type: string
                  enum: [attendance, payroll, employee, leave, finance]
                periodStart:
                  type: string
                  format: date
                periodEnd:
                  type: string
                  format: date
                filters:
                  type: object
                  additionalProperties: true
                async:
                  type: boolean
      responses:
        '202': { description: Accepted }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Reporting]
      summary: List report snapshots
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: reportType
          in: query
          required: false
          schema:
            type: string
            enum: [attendance, payroll, employee, leave, finance]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, processing, completed, failed]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/hcm/reports/snapshots/{id}:
    get:
      tags: [Reporting]
      summary: Get report snapshot detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /v1/hcm/reports/snapshots/{id}/export:
    post:
      tags: [Reporting]
      summary: Export snapshot file (csv, excel, pdf)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileType]
              properties:
                fileType:
                  type: string
                  enum: [csv, excel, pdf]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 12 }
                      fileType: { type: string, enum: [csv, excel, pdf], example: csv }
                      fileUrl: { type: string, example: /storage/report-exports/company_1/snapshot_8/employee_2026-03-01_to_2026-03-31_20260413_221530.csv }
                      fileName: { type: string, example: employee_2026-03-01_to_2026-03-31_20260413_221530.csv }
                      generatedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { description: Export generation failed }

  # -------------------------
  # Tickets (implemented under /v1/hcm)
  # -------------------------
  /v1/hcm/tickets:
    get:
      tags: [Tickets]
      summary: List tickets (admin all, employee own)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      tags: [Tickets]
      summary: Create ticket
      security:
        - bearerAuth: []
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/tickets/{id}:
    get:
      tags: [Tickets]
      summary: Ticket detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Tickets]
      summary: Update ticket (admin can status/assign; employee limited)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Tickets]
      summary: Delete ticket (employee own; locked if closed)
      security:
