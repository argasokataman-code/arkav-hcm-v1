name: Deploy to Shared Hosting

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # push trigger disabled — shared hosting not in use
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Artifact to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for production artifact
        run: |
          ARTIFACT=$(ls -t release/shared-hosting/shared-hosting-artifact-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "❌ ERROR: No production artifact found in release/shared-hosting/"
            echo ""
            echo "📋 LOCAL BUILD REQUIRED before push:"
            echo "   cd backend"
            echo "   composer install --no-dev"
            echo "   npm ci && npm run build"
            echo "   cd .."
            echo "   bash scripts/shared-hosting-package-local.sh"
            echo "   git add release/ && git commit && git push"
            echo ""
            exit 1
          fi
          echo "✅ Found artifact: $ARTIFACT"

      - name: Guard artifact sync with commit
        run: |
          chmod +x scripts/check-shared-hosting-artifact-sync.sh
          bash scripts/check-shared-hosting-artifact-sync.sh "${GITHUB_SHA}"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy artifact to server
        run: |
          cd release/shared-hosting
          ARTIFACT=$(ls -t shared-hosting-artifact-*.tar.gz | head -1)
          echo "📦 Uploading: $ARTIFACT"
          scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key "$ARTIFACT" ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/public_html/hr.jogjatourdrive.com/
          
          echo "🚀 Extracting, deploying, and cleaning up old artifacts..."
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -euo pipefail
          cd /home/${{ secrets.SSH_USER }}/public_html/hr.jogjatourdrive.com
          ARTIFACT=$(ls -t shared-hosting-artifact-*.tar.gz | head -1)
          tar -xzf "$ARTIFACT"
          bash scripts/shared-hosting-deploy-easy.sh
          echo "✅ Deploy complete!"
           bash scripts/shared-hosting-fix-docroot.sh
           echo "✅ Docroot bridge applied!"
          # Cleanup: keep only the latest artifact, delete the rest
          ls -t shared-hosting-artifact-*.tar.gz 2>/dev/null | tail -n +2 | xargs -r rm -f
          echo "✅ Old artifacts cleaned up (kept: $ARTIFACT)"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
