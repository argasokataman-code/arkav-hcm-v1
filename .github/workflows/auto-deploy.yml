name: Deploy Arkav HCM

# Strategi deploy dipertahankan: build -> push -> pull -> run.
# Optimasi: gunakan Buildx cache agar build image jauh lebih cepat.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy runtime guard
        run: bash scripts/check-deploy-runtime-guard.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
            
            mkdir -p /data/code/storage/logs
            mkdir -p /data/code/storage/framework/cache/data
            mkdir -p /data/code/storage/framework/sessions
            mkdir -p /data/code/storage/framework/views
            mkdir -p /data/code/storage/app/public
            mkdir -p /data/code/storage/app/private

            docker pull ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest
            docker rm -f arkav-hcm || true
            docker run -d --name arkav-hcm --restart always \
              -p 8007:8007 -p 5179:5179 \
              -v /data/code/.env:/app/backend/.env \
              -v /data/code/storage:/app/backend/storage \
              ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest
            docker exec arkav-hcm bash -c "cd /app/backend && mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/public storage/app/private bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache && php artisan config:clear && php artisan view:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force"

            # Hard check: pastikan container benar-benar running sebelum lanjut.
            running_state=$(docker inspect -f '{{.State.Running}}' arkav-hcm 2>/dev/null || echo "false")
            if [[ "$running_state" != "true" ]]; then
              echo "[deploy] container arkav-hcm tidak running setelah docker run" >&2
              docker logs --tail 300 arkav-hcm || true
              exit 1
            fi

            backend_ok=false
            frontend_ok=false
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8007/health >/dev/null 2>&1 && backend_ok=true
              curl -fsS http://127.0.0.1:5179/       >/dev/null 2>&1 && frontend_ok=true
              [[ "$backend_ok" == true && "$frontend_ok" == true ]] && break
              sleep 2
            done

            if [[ "$backend_ok" != true || "$frontend_ok" != true ]]; then
              echo "[deploy] health check GAGAL: backend=$backend_ok frontend=$frontend_ok" >&2
              docker logs --tail 300 arkav-hcm || true
              exit 1
            fi

            # Hard check kedua: validasi status akhir container setelah inisialisasi.
            final_running_state=$(docker inspect -f '{{.State.Running}}' arkav-hcm 2>/dev/null || echo "false")
            restart_count=$(docker inspect -f '{{.RestartCount}}' arkav-hcm 2>/dev/null || echo "unknown")
            if [[ "$final_running_state" != "true" ]]; then
              echo "[deploy] container arkav-hcm tidak running setelah init (restart_count=$restart_count)" >&2
              docker logs --tail 300 arkav-hcm || true
              exit 1
            fi
            
            docker image prune -a -f
            echo "[deploy] selesai"
          EOF