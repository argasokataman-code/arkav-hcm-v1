  /v1/hcm/employees/bulk-template:
    get:
      tags: [HCM]
      summary: Download employee bulk import template
      description: |
        Returns the tenant-scoped employee workbook template.
        The template is only available when the active company already has at least one department and one designation master.
        The endpoint uses tenant-scoped masters only; it will return `422` if the active company does not have the required organization masters.
        The primary sheet uses name-only columns (`team`, `department`, `designation`) — the `_id` columns have been removed from the template to simplify data entry.
        Designation and team lists are scoped directly by the active company's `company_id`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: XLSX template file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Organization master prerequisite is missing for bulk employee import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                orgSetupRequired:
                  value:
                    success: false
                    error:
                      code: EMPLOYEE_BULK_ORG_SETUP_REQUIRED
                      message: Isi minimal satu department dan satu designation sebelum download employee bulk template.

  /v1/hcm/employees/bulk-upload:
    post:
      tags: [HCM]
      summary: Bulk create/update employees from spreadsheet
      description: |
        Accepts XLSX/XLS/CSV/TXT employee imports for the active tenant.
        Existing employees are matched by `employee_uuid` or `email`.
        Organization fields may be provided by ID or master name using `department_id`/`department` and `designation_id`/`designation`.
        Import is blocked until the active company has at least one department and one designation.
        The server validates organization fields against tenant-scoped masters only; uploads will be rejected with `EMPLOYEE_BULK_ORG_SETUP_REQUIRED` if the tenant has no masters.
        Designation resolution during upload uses `WHERE company_id = activeCompanyId` (consistent with template generation). The `designation_id` path also applies tenant scope to prevent cross-tenant access.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Bulk import applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      createdRows: { type: integer }
                      updatedRows: { type: integer }
                      failedRows: { type: integer }
                      errors:
                        type: array
                        items: { type: string }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Validation failure; import is rolled back all-or-nothing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                employeeCountExceeded:
                  value:
                    success: false
                    error:
                      code: EMPLOYEE_COUNT_EXCEEDED
                      message: "Cannot add more employees. Current: 10, trying to add: 11, plan limit: 10"
                orgSetupRequired:
                  value:
                    success: false
                    error:
                      code: EMPLOYEE_BULK_ORG_SETUP_REQUIRED
                      message: Isi minimal satu department dan satu designation sebelum bulk upload employee data.

  /v1/hcm/billing/checkout:
    post:
      tags: [SaaS, HCM]
      summary: Tenant subscription checkout (create or reuse invoice)
      description: |
        Creates a new pending subscription + invoice for the active company, or returns an
        existing unpaid invoice with `reused: true` if one already exists.

        **Global dedup guard**: if the company has ANY unpaid invoice (`status` in `draft`/`sent`,
        `is_paid=false`), the endpoint reuses it and returns immediately — no new invoice or
        subscription is created. This prevents double-billing when a user revisits the checkout
        page after payment is already in progress. The client must hide the checkout form and
        prompt the user to pay the existing invoice.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_uuid, billing_cycle]
              properties:
                package_uuid:
                  type: string
                  format: uuid
                billing_cycle:
                  type: string
                  enum: [monthly, yearly]
                billingEmail:
                  type: string
                  format: email
                  nullable: true
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      subscription:
                        type: object
                        properties:
                          id: { type: integer }
                          status: { type: string }
                          billingCycle: { type: string }
                          amount: { type: number }
                          packageId: { type: string, format: uuid }
                          packageCode: { type: string }
                          packageName: { type: string }
                      invoice:
                        type: object
                        properties:
                          id: { type: integer }
                          invoiceNumber: { type: string, nullable: true }
                          issueDate: { type: string, nullable: true }
                          dueDate: { type: string, nullable: true }
                          amountDue: { type: number }
                          isPaid: { type: boolean }
                          status: { type: string }
                      reused: { type: boolean }
        '200':
          description: Reused existing pending invoice
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v1~1hcm~1billing~1checkout/post/responses/201/content/application~1json/schema'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Validation error or tenant context missing (TENANT_CONTEXT_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tenantContextRequired:
                  value:
                    success: false
                    error:
                      code: TENANT_CONTEXT_REQUIRED
                      message: Active company context is required.

