        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/mock/webhook/charge-succeeded:
    post:
      tags: [Development, Billing]
      summary: Simulate a successful mock payment webhook
      description: Development-only helper endpoint for marking a pending mock payment as completed via payment UUID.
      security:
        - bearerAuth: []
      requestBody:
