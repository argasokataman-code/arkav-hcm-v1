    get:
      tags: [Attendance]
      summary: Employee attendance today (self)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      userName:
                        type: string
                      team:
                        type: string
                      profilePhotoUrl:
                        type: string
                        nullable: true
                        description: Public URL avatar employee dari profile photo path.
                      nowLabel:
                        type: string
                      punchState:
                        type: string
                        enum: [none, in, done]
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /v1/hcm/attendance/me/history:
    get:
      tags: [Attendance]
      summary: Employee attendance history (self)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /v1/hcm/attendance/me/stats:
    get:
      tags: [Attendance]
      summary: Employee attendance stats (self)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /v1/hcm/attendance/me/punch:
    post:
      tags: [Attendance]
      summary: Punch in/out (self, requires latitude/longitude)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/attendance/me/break:
    post:
      tags: [Attendance]
      summary: Toggle break (self)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/attendance/me/correction-request:
    post:
      tags: [Attendance]
      summary: Request correction (self)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/attendance/me/selfie:
    post:
      tags: [Attendance]
      summary: Upload attendance selfie for today (self)
      description: |
        Uploads selfie attachment for today's attendance record.
        Request is rejected when attendance has not started (`check_in_at` missing).
        Payload accepts only JPEG/PNG/WEBP and maximum 5MB (decoded binary).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selfie_base64]
              properties:
                selfie_base64:
                  type: string
                  description: Base64-encoded image payload (JPEG/PNG/WEBP, max 5MB decoded).
                timestamp:
                  type: integer
                  nullable: true
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422':
          description: Validation error or attendance not started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [VALIDATION_ERROR, ATTENDANCE_NOT_STARTED]
                      message: { type: string }
  /v1/hcm/attendance/me/selfie/status:
    get:
      tags: [Attendance]
      summary: Get selfie status for today's attendance (self)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /v1/hcm/timesheets:
    get:
      tags: [Attendance]
      summary: Timesheets (admin only, DB paginated)
      security:
        - bearerAuth: []
      parameters:
        - { name: dateFrom, in: query, required: false, schema: { type: string, format: date } }
        - { name: dateTo, in: query, required: false, schema: { type: string, format: date }, description: "Must be after or equal to dateFrom when both are provided." }
        - { name: project, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/hcm/schedule-timing:
    get:
      tags: [Attendance]
      summary: Schedule timing list (admin only, paginated)
      security:
        - bearerAuth: []
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/hcm/schedule-timing/{userId}:
    put:
      tags: [Attendance]
      summary: Upsert schedule timing override for one user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shiftId:
                  type: integer
                  nullable: true
                  description: Active contract uses hcm_shifts.id.
                startTime:
                  type: string
                  nullable: true
                  pattern: '^\\d{2}:\\d{2}$'
                  description: Required when `shiftId` is omitted.
                endTime:
                  type: string
                  nullable: true
                  pattern: '^\\d{2}:\\d{2}$'
                  description: Required when `shiftId` is omitted. May be lower than `startTime` for overnight schedule, but cannot be equal.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Attendance]
      summary: Delete schedule timing override for one user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /v1/hcm/smart-attendance-shifting/generate:
    post:
      tags: [Attendance]
      summary: Generate smart attendance and shift plan (admin only)
      description: |
        Data-driven scheduler and attendance analyzer based on runtime tenant data
        (employee membership, shift templates, attendance history).
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                weekStart:
                  type: string
                  format: date
                employeeIds:
                  type: array
                  items:
                    type: integer
                shiftCategory:
                  type: string
                  enum: [office_hour, shifting_24h, hybrid]
                rules:
                  type: object
                  properties:
                    max_work_days_per_week: { type: integer, minimum: 1, maximum: 7 }
                    min_days_off_per_week: { type: integer, minimum: 0, maximum: 7 }
                    min_rest_hours_between_shifts: { type: integer, minimum: 1, maximum: 24 }
                    max_consecutive_night_shifts: { type: integer, minimum: 1, maximum: 7 }
                    illegal_transition_rules:
                      type: array
                      items: { type: string }
                    late_tolerance_minutes: { type: integer, minimum: 0, maximum: 120 }
                    early_leave_tolerance_minutes: { type: integer, minimum: 0, maximum: 120 }
                    overtime_threshold_minutes: { type: integer, minimum: 0, maximum: 480 }
                forbiddenTransitions:
                  type: array
                  description: Preferred transition format `from:to`, e.g. `night:morning`.
                  items: { type: string }
                coverageRequirements:
                  type: array
                  items:
                    type: object
                    required: [date, required]
                    properties:
                      date:
                        type: string
                        format: date
                      required:
                        type: array
                        items:
                          type: object
                          required: [shift_id, headcount]
                          properties:
                            shift_id: { type: string }
                            headcount: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      schedule_generation:
                        type: object
                        properties:
                          validation_status: { type: string, enum: [valid, invalid] }
                          weekly_schedule: { type: array, items: { type: object } }
                          violations: { type: array, items: { type: object } }
                          unmet_coverage: { type: array, items: { type: object } }
                      attendance_analysis:
                        type: object
                        properties:
                          employee_summaries: { type: array, items: { type: object } }
                          flags: { type: array, items: { type: object } }
                      recommendation:
                        type: object
                        properties:
                          fairness_score: { type: number, minimum: 0, maximum: 100 }
                          fatigue_risk_score: { type: number, minimum: 0, maximum: 100 }
                          improvement_suggestions: { type: array, items: { type: object } }
                      explanation: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/smart-attendance-shifting/settings:
    get:
      tags: [Attendance]
      summary: Get smart planner default settings (admin only)
      description: |
        Tenant context tetap mengikuti runtime active company context (numeric legacy header/session resolver).
        Persistence settings memakai dual-write (`company_id` + `company_uuid`) agar relasi tenant tetap enforceable pada environment UUID-cutover.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      defaultRules:
                        type: object
                        properties:
                          max_work_days_per_week: { type: integer }
                          min_days_off_per_week: { type: integer }
                          min_rest_hours_between_shifts: { type: integer }
                          max_consecutive_night_shifts: { type: integer }
                      forbiddenTransitions:
                        type: array
                        items: { type: string }
                      transitionCatalog:
                        type: array
                        items: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    put:
      tags: [Attendance]
      summary: Update smart planner default settings (admin only)
      description: |
        Kontrak payload tidak berubah.
        Backend menyimpan actor dan tenant identifier dalam mode dual-write legacy+UUID untuk kompatibilitas transisi schema.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultRules:
                  type: object
                  properties:
                    max_work_days_per_week: { type: integer, minimum: 1, maximum: 7 }
                    min_days_off_per_week: { type: integer, minimum: 0, maximum: 7 }
                    min_rest_hours_between_shifts: { type: integer, minimum: 1, maximum: 24 }
                    max_consecutive_night_shifts: { type: integer, minimum: 1, maximum: 7 }
                forbiddenTransitions:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/smart-attendance-shifting/publish-roster:
    post:
      tags: [Attendance]
      summary: Publish planner draft into dated rosters (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weeklySchedule]
              properties:
                weeklySchedule:
                  type: array
                  items:
                    type: object
                    required: [employee_id, assignments]
                    properties:
                      employee_id:
                        oneOf:
                          - { type: integer }
                          - { type: string }
                      assignments:
                        type: array
                        items:
                          type: object
                          required: [date, shift_id]
                          properties:
                            date: { type: string, format: date }
                            shift_id: { type: string }
                            start_time: { type: string, nullable: true }
                            end_time: { type: string, nullable: true }
                            cross_day: { type: boolean, nullable: true }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/smart-attendance-shifting/simulate-swap:
    post:
      tags: [Attendance]
      summary: Simulate shift swap between two employees (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userAId, userBId, swapDateA, swapDateB]
              properties:
                userAId: { type: integer }
                userBId: { type: integer }
                swapDateA: { type: string, format: date }
                swapDateB: { type: string, format: date }
      responses:
        '200':
          description: Swap simulation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      swappable: { type: boolean }
                      swap_summary: { type: string }
                      overall_risk_level: { type: integer }
                      employee_a: { type: object }
                      employee_b: { type: object }
                      warnings: { type: array, items: { type: string } }
                      advice: { type: string }
                      reason: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/smart-attendance-shifting/find-replacement:
    post:
      tags: [Attendance]
      summary: Find replacement candidates for absent employee (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [absentUserId, absentDates, shiftId]
              properties:
                absentUserId: { type: integer }
                absentDates:
                  type: array
                  items: { type: string, format: date }
                shiftId: { type: string }
      responses:
        '200':
          description: Replacement candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      message: { type: string }
                      candidates:
                        type: array
                        items:
                          type: object
                          properties:
                            employee_id: { type: integer }
                            employee_name: { type: string }
                            job_title: { type: string, nullable: true }
                            reason: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/schedule-rosters:
    get:
      tags: [Attendance]
      summary: List dated schedule rosters (admin only)
      security:
        - bearerAuth: []
      parameters:
        - { name: dateFrom, in: query, required: true, schema: { type: string, format: date } }
        - { name: dateTo, in: query, required: true, schema: { type: string, format: date } }
        - { name: employeeIds, in: query, required: false, schema: { type: array, items: { type: integer } }, style: form, explode: true }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

