                    properties:
                      payment_id: { type: integer }
                      payment_uuid: { type: string, format: uuid }
                      invoice_uuid: { type: string, format: uuid, nullable: true }
                      status: { type: string }
                      paid_at: { type: string, format: date-time, nullable: true }
                      callback_token: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # -------------------------
  # User Management (implemented under /v1/hcm/user-management)
  # -------------------------
  /v1/hcm/user-management/users:
    get:
      tags: [User Management]
      summary: List users (admin only, tenant-scoped)
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive, all] } }
        - { name: roleCode, in: query, required: false, schema: { type: string, maxLength: 80 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [User Management]
      summary: Create user (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                roleCodes:
                  type: array
                  items: { type: string }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/users/export:
    get:
      tags: [User Management]
      summary: Export user list as CSV (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/hcm/user-management/users/{id}:
    get:
      tags: [User Management]
      summary: User detail with role assignments and effective permissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserNumericIdPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [User Management]
      summary: Update user profile/status (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserNumericIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 150 }
                email: { type: string, format: email, maxLength: 255 }
                status: { type: string, enum: [active, inactive] }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/roles:
    get:
      tags: [User Management]
      summary: List roles (tenant-scoped)
      security:
        - bearerAuth: []
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [global, company] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive, archived, all] } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [User Management]
      summary: Create tenant role (tenant manage permission)
      description: Tenant role setup is managed in active company context by users with tenant-manage permission, including global HCM admin when operating inside that tenant context.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 80 }
                name: { type: string, maxLength: 150 }
                description: { type: string, nullable: true, maxLength: 2000 }
                status: { type: string, enum: [active, inactive] }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/roles/{id}:
    put:
      tags: [User Management]
      summary: Update tenant role (tenant manage permission)
      description: Tenant role setup is managed in active company context by users with tenant-manage permission, including global HCM admin when operating inside that tenant context.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleIdentifierPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 150 }
                description: { type: string, nullable: true, maxLength: 2000 }
                status: { type: string, enum: [active, inactive, archived] }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [User Management]
      summary: Delete or archive tenant role (tenant manage permission)
      description: Tenant role setup is managed in active company context by users with tenant-manage permission, including global HCM admin when operating inside that tenant context.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleIdentifierPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/permissions:
    get:
      tags: [User Management]
      summary: List permissions visible to the current admin context
      description: Returns the active permission catalog for the role builder. Non-global admins never receive permissions with module=system; global HCM admins receive the full catalog.
      security:
        - bearerAuth: []
      parameters:
        - { name: module, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/hcm/user-management/roles/{id}/permissions:sync:
    post:
      tags: [User Management]
      summary: Replace role permissions with provided permission codes
      description: Permission sync is managed in active company context by users with tenant-manage permission, including global HCM admin when operating inside that tenant context.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleIdentifierPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionCodes]
              properties:
                permissionCodes:
                  type: array
                  minItems: 1
                  items: { type: string, maxLength: 120 }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/users/{id}/roles:
    get:
      tags: [User Management]
      summary: List role assignments for a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdentifierPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      tags: [User Management]
      summary: Assign role to user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdentifierPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleCode]
              properties:
                roleCode: { type: string, maxLength: 80 }
                effectiveFrom: { type: string, format: date, nullable: true }
                effectiveUntil: { type: string, format: date, nullable: true }
                notes: { type: string, maxLength: 2000, nullable: true }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/user-management/users/{id}/roles/{assignmentId}:
    delete:
      tags: [User Management]
      summary: Revoke role assignment from user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdentifierPath'
        - $ref: '#/components/parameters/AssignmentIdentifierPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # -------------------------
  # Reporting Snapshots (implemented under /v1/hcm/reports/snapshots)
  # -------------------------
  /v1/hcm/reports/snapshots:
    post:
      tags: [Reporting]
      summary: Generate report snapshot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportType, periodStart, periodEnd]
              properties:
                reportType:
                  type: string
                  enum: [attendance, payroll, employee, leave, finance]
                periodStart:
                  type: string
                  format: date
                periodEnd:
                  type: string
                  format: date
                filters:
                  type: object
                  additionalProperties: true
                async:
                  type: boolean
      responses:
        '202': { description: Accepted }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Reporting]
      summary: List report snapshots
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: reportType
          in: query
          required: false
          schema:
            type: string
            enum: [attendance, payroll, employee, leave, finance]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, processing, completed, failed]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /v1/hcm/reports/snapshots/{id}:
    get:
      tags: [Reporting]
      summary: Get report snapshot detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportSnapshotIdentifierPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /v1/hcm/reports/snapshots/{id}/export:
    post:
      tags: [Reporting]
      summary: Export snapshot file (csv, excel, pdf)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportSnapshotIdentifierPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileType]
              properties:
                fileType:
                  type: string
                  enum: [csv, excel, pdf]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 12 }
                      fileType: { type: string, enum: [csv, excel, pdf], example: csv }
