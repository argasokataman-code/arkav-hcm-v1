  /v1/hcm/payroll-runs/{id}/disburse:
    post:
      tags: [Payroll]
      summary: Disburse monthly payroll via gateway (HCM admin)
      description: |
        Wajib melalui flow hosted mock payment (`/mock-hosted-checkout` lalu `/mock-hosted-checkout/confirm`) saat mock flow aktif.
        Token konfirmasi dikirim lewat `mockApprovalToken`.
        Menjalankan pembayaran gateway untuk subset `userIds` yang dipilih. Jika run masih `draft`, API akan
        otomatis memfinalkan run dan menandai periodenya sebagai `posted` sebelum menulis status pembayaran per karyawan.
        Pemanggilan berulang aman/idempotent: user yang sudah `paid` akan dilewati.
        Hanya user dengan total net pay `> 0` yang eligible untuk didisburse.
        Untuk run `purpose=monthly`, server menolak request sebelum `resolvedPaydayDate` bila
        `disburseBeforePaydayAllowed=false` pada `policySnapshot` (atau fallback setting tenant aktif).
        MVP saat ini tidak menyediakan override inline untuk bypass guard tersebut; exception operasional
        dilakukan melalui perubahan policy tenant yang disetujui lalu rebuild snapshot run.
        Endpoint juga menolak request dengan `PAYROLL_TAX_PROFILE_INCOMPLETE` jika masih ada line PPh21
        yang menandakan profil pajak karyawan belum lengkap (`missingTaxProfile=true`).
        Saat fitur reconciliation enforcement aktif, endpoint juga dapat mengembalikan
        `EXPORT_RECON_REQUIRED` / `EXPORT_RECON_EXPIRED` / `EXPORT_RECON_SCOPE_MISMATCH` / `EXPORT_RECON_STALE_DATA`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Optional subset of employee user UUIDs to disburse. Required when applyAll is not true.
                applyAll:
                  type: boolean
                  description: Set true to disburse all eligible employees in the run explicitly.
                mockApprovalToken:
                  type: string
                  nullable: true
                  description: Callback token dari flow hosted mock payment yang sudah terkonfirmasi.
      responses:
        '200':
          description: Gateway disbursement processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      run:
                        type: object
                        properties:
                          policySnapshot:
                            type: object
                            nullable: true
                            properties:
                              paydayDay: { type: integer, minimum: 1, maximum: 31, example: 28 }
                              cutoffOffsetDays: { type: integer, minimum: 0, maximum: 15, example: 3 }
                              payrollTimezone: { type: string, example: Asia/Jakarta }
                              disburseBeforePaydayAllowed: { type: boolean, example: false }
                              resolvedPaydayDate: { type: string, format: date, nullable: true, example: '2026-04-28' }
                              resolvedCutoffDate: { type: string, format: date, nullable: true, example: '2026-04-25' }
                              draftDataAsOfDate: { type: string, format: date, nullable: true, example: '2026-04-30' }
                          lateArrivalBuffer:
                            type: object
                            nullable: true
                            properties:
                              capturedAt: { type: string, format: date-time, nullable: true }
                              asOfDate: { type: string, format: date, nullable: true }
                              periodStartDate: { type: string, format: date, nullable: true }
                              periodEndDate: { type: string, format: date, nullable: true }
                              hasLateArrivals: { type: boolean, example: false }
                              migrationMode: { type: string, nullable: true, example: next-period-date-based-rollover }
                              sources:
                                type: object
                                nullable: true
                                properties:
                                  overtimeRequests:
                                    type: object
                                    nullable: true
                                    properties:
                                      totalCount: { type: integer, example: 0 }
                                  payrollItemAssignments:
                                    type: object
                                    nullable: true
                                    properties:
                                      totalCount: { type: integer, example: 0 }
                      selectedUserIds:
                        type: array
                        items: { type: integer }
                      ineligibleUserIds:
                        type: array
                        items: { type: integer }
                      skippedAlreadyPaidUserIds:
                        type: array
                        items: { type: integer }
                      gatewayReference:
                        type: string
                        nullable: true
                      lateArrivalMigration:
                        type: object
                        nullable: true
                        properties:
                          sourceRunId:
                            type: integer
                            example: 123
                          targetPeriodId:
                            type: integer
                            example: 456
                          targetPeriodYear:
                            type: integer
                            example: 2026
                          targetPeriodMonth:
                            type: integer
                            example: 4
                          targetRunId:
                            type: integer
                            example: 789
                      payment:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [unpaid, partial, paid]
                          employeeCount:
                            type: integer
                          paidEmployeeCount:
                            type: integer
                          paidUserIds:
                            type: array
                            items: { type: integer }
                          paidAt:
                            type: string
                            format: date-time
                            nullable: true
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422':
          description: Validation/domain error termasuk PAYROLL_DISBURSE_NO_EMPLOYEES, PAYROLL_DISBURSE_BEFORE_PAYDAY_FORBIDDEN, PAYROLL_RUN_EMPTY, PAYROLL_FINALIZED_EXISTS, PAYROLL_TAX_PROFILE_INCOMPLETE, PAYROLL_MOCK_PAYMENT_REQUIRED, PAYROLL_MOCK_PAYMENT_TOKEN_INVALID, PAYROLL_MOCK_PAYMENT_SELECTION_MISMATCH, EXPORT_RECON_REQUIRED, EXPORT_RECON_EXPIRED, EXPORT_RECON_SCOPE_MISMATCH, EXPORT_RECON_STALE_DATA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
