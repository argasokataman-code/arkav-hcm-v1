        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, package_uuid, status, starts_at, billing_cycle]
              properties:
                company_id: { type: string, format: uuid }
                package_uuid: { type: string, format: uuid }
                status:
                  type: string
                  enum: [active, trial, pending_payment, inactive, expired, cancelled, suspended]
                starts_at: { type: string, format: date }
                ends_at:
                  type: string
                  format: date
                  nullable: true
                  description: Required when status is active, trial, or pending_payment (payment / provisioning window end)
                trial_ends_at:
                  type: string
                  format: date
                  nullable: true
                  description: Required when status is trial; must be after starts_at and on or before ends_at
                auto_renew: { type: boolean }
                billing_cycle: { type: string, enum: [monthly, yearly] }
                amount: { type: number, minimum: 0, nullable: true }
      responses:
        '201':
          description: Created
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /v1/saas/packages/feature-catalog:
    get:
      tags: [SaaS]
      summary: Get backend-driven package feature catalog
      description: Returns canonical backend feature catalog used by packages management UI, including feature tier mapping (`mvp` or `addon`) and metadata lists (`meta.mvp_feature_codes`, `meta.addon_feature_codes`) where addon list is derived from all catalog features outside MVP mapping.
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/saas/subscriptions/{subscription}:
    parameters:
      - name: subscription
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [SaaS]
      summary: Get subscription by id (HCM admin)
      description: Admin-only detail lookup for one subscription.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/SaasSubscription' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [SaaS]
      summary: Update subscription (HCM admin)
      description: |
        Jika hasil update membuat subscription menjadi `active`/`trial`, API menolak konflik
        dengan record aktif/trial lain pada company yang sama (`422 ACTIVE_SUBSCRIPTION_ALREADY_EXISTS`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                package_uuid: { type: string, format: uuid }
                status:
                  type: string
                  enum: [active, trial, pending_payment, inactive, expired, cancelled, suspended]
                starts_at: { type: string, format: date }
                ends_at: { type: string, format: date, nullable: true }
                trial_ends_at:
                  type: string
                  format: date
                  nullable: true
                  description: Required when resulting status is trial; send null to clear when leaving trial
                auto_renew: { type: boolean }
                billing_cycle: { type: string, enum: [monthly, yearly] }
                amount: { type: number, minimum: 0, nullable: true }
      responses:
        '200':
          description: OK
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [SaaS]
      summary: Delete subscription (HCM admin)
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /v1/saas/subscriptions/{subscription}/renew:
    parameters:
      - name: subscription
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [SaaS]
      summary: Renew subscription — sets active, starts_at now, ends_at from body (HCM admin)
      description: |
        Typical prior statuses: expired, cancelled, suspended, inactive. Not valid for `pending_payment` (422).
        Renew ditolak jika company sudah memiliki subscription lain yang masih `active`/`trial`
        (`422 ACTIVE_SUBSCRIPTION_ALREADY_EXISTS`).
        Web UI `/saas/subscriptions` may resolve `{subscription}` via **Renew by UUID** (`GET /v1/saas/subscriptions/{subscription}` first).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ends_at]
              properties:
                ends_at: { type: string, format: date }
      responses:
        '200':
          description: OK
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/subscriptions/preview-change:
    post:
      tags: [HCM Billing]
      summary: Preview tenant-initiated plan change (owner / tenant admin) — F4
      description: |
        Dry-run perhitungan selisih harga dan jadwal berlakunya untuk upgrade / downgrade / cancel.
        Tidak menulis apa pun; aman dipanggil berulang dari UI `/upgrade`.
        `to_package_uuid` untuk upgrade/downgrade wajib mengarah ke package `status=active`.
        Package `trial` ditolak sebagai target (`422 TRIAL_PACKAGE_NOT_ALLOWED`).
        Response preview juga memuat `anomaly_flags` + `anomaly_details` untuk skenario
        billing negatif (invoice overdue/partial/unpaid) tanpa memblok downgrade.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [upgrade, downgrade, cancel] }
                to_package_uuid:
                  type: string
                  format: uuid
                  nullable: true
                  description: Wajib untuk upgrade/downgrade; abaikan untuk cancel.
      responses:
        '200': { description: OK }
        '400': { description: Active company context required }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/subscriptions/change-plan:
    post:
      tags: [HCM Billing]
      summary: Submit plan change request (owner / tenant admin) — F4
      description: |
        Mencatat request status `pending` untuk disetujui super-admin. Hanya boleh ada satu request
        pending per company (duplicate → `409 CHANGE_REQUEST_PENDING`).
        `to_package_uuid` untuk upgrade/downgrade wajib package aktif (`422 PACKAGE_NOT_ACTIVE`).
        Package `trial` ditolak sebagai target (`422 TRIAL_PACKAGE_NOT_ALLOWED`).
        Downgrade tetap diizinkan walau tenant memiliki anomali billing; ringkasan anomali
        disimpan di `preview.notes` dan `preview.anomaly_flags`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [upgrade, downgrade, cancel] }
                to_package_uuid: { type: string, format: uuid, nullable: true }
                notes: { type: string, maxLength: 500, nullable: true }
      responses:
        '201': { description: Pending request created }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { description: Pending request already exists }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/subscriptions/cancel-change:
    post:
      tags: [HCM Billing]
      summary: Cancel a pending tenant plan change request — F4
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Not found }
        '422': { description: Not pending }

  /v1/hcm/subscriptions/change-requests:
    get:
