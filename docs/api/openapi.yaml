              required: [company_id, issue_date, due_date, amount_due]
              properties:
                company_id: { type: string, format: uuid }
                purchase_transaction_id: { type: string, format: uuid, nullable: true }
                subscription_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Same-company subscription; used to auto-activate pending_payment on mark paid
                issue_date: { type: string, format: date }
                due_date: { type: string, format: date }
                amount_due: { type: number, minimum: 0 }
                notes: { type: string, nullable: true }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/saas/companies/billing-overview:
    get:
