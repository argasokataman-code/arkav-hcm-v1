        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { description: Not found — record does not belong to active company }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Leave]
      summary: Disable leave type (admin only, per tenant)
      description: Soft-disables a leave type (is_enabled=false). Returns 404 if the record does not belong to the active company.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
