  /v1/hcm/employees:
    get:
      tags: [HCM]
      summary: List employees
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DepartmentId'
        - $ref: '#/components/parameters/DesignationId'
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/EmploymentStatus'
        - $ref: '#/components/parameters/EmployeeScope'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeDirectoryRow'
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      perPage: { type: integer }
                      total: { type: integer }
                      summary:
                        type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Validation error, or tenant context missing (TENANT_CONTEXT_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tenantContextRequired:
                  value:
                    success: false
                    error:
                      code: TENANT_CONTEXT_REQUIRED
                      message: Active company context is required to list employees.
    post:
      tags: [HCM]
      summary: Create employee
      description: |
        Requires active tenant context (`activeCompanyId`).
        Global Super Admin (`users.is_super_admin = 1`) can create employee lintas tenant without being blocked by subscription employee-limit validation (`EMPLOYEE_COUNT_EXCEEDED`).
        Assignment to inactive teams is rejected with `TEAM_INACTIVE_NOT_ASSIGNABLE`.
        Free-text team assignment without `teamId` is rejected with `TEAM_MASTER_SELECTION_REQUIRED`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          description: Validation error, or subscription plan limit exceeded (EMPLOYEE_COUNT_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                employeeCountExceeded:
                  value:
                    success: false
                    error:
                      code: EMPLOYEE_COUNT_EXCEEDED
                      message: "Cannot add more employees. Current: 10, trying to add: 11, plan limit: 10"
                inactiveTeamAssignment:
                  value:
                    success: false
                    error:
                      code: TEAM_INACTIVE_NOT_ASSIGNABLE
                      message: Inactive team cannot receive member assignments.
                teamMasterSelectionRequired:
                  value:
                    success: false
                    error:
                      code: TEAM_MASTER_SELECTION_REQUIRED
                      message: Team assignment must use teamId from team master. Leave team empty to keep unassigned.
