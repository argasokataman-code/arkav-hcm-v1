                              enum: [monthly, thr, pkwt_compensation]
                            status:
                              type: string
                            finalizedAt:
                              type: string
                              format: date-time
                              nullable: true
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            userId:
                              type: integer
                            salaryComponentId:
                              type: integer
                              nullable: true
                            componentCode:
                              type: string
                              nullable: true
                            componentName:
                              type: string
                              nullable: true
                            kind:
                              type: string
                              enum: [addition, deduction]
                            category:
                              type: string
                              nullable: true
                            amount:
                              type: number
                              format: float
                              example: 5000000
                            sortOrder:
                              type: integer
                              example: 1
                            meta:
                              type: object
                              nullable: true
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422':
          description: Validation error - invalid periodYear/periodMonth
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /v1/hcm/payroll/my-thr-slip:
    get:
      tags: [Payroll]
      summary: Slip THR karyawan login (JSON; PDF lewat GET thr-batch/lines/{line}/slip)
      description: |
        Mengembalikan `data.line` + `data.batch` untuk slip PDF terbaru milik user (ada `slip_storage_path`),
        atau `line`/`batch` null jika belum ada. `data.history` berisi `{ lineId, calendarYear }` untuk pemilih tahun.
        Query opsional `calendarYear` memilih slip tahun tersebut.
        Objek `line` menyertakan `thrSlipPublicNo` (unik di DB), `slipNumber` (dengan `#` di depan), `calendarYear`, serta `bankName` / `bankAccountNo` dari profil jika terisi.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarYear
          in: query
          required: false
          schema: { type: integer, minimum: 2000, maximum: 2100, nullable: true }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/payroll/pkwt-compensations:
