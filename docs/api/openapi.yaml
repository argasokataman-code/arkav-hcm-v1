                      paidAt: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /v1/hcm/billing/invoices/{id}/mock-hosted-checkout:
    post:
      tags: [SaaS, HCM]
      summary: Start Midtrans Snap hosted checkout for a tenant invoice
      description: Creates a Midtrans Snap transaction and returns a snapToken (for popup) and hostedCheckoutUrl (redirect fallback). Reuses existing pending Midtrans payment when available (idempotent).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InvoiceNumericIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                gatewayMode:
                  type: string
                  enum: [auto, midtrans, mock]
                  default: auto
                paymentMethod:
                  type: string
                  enum: [bank_transfer, credit_card, gopay, qris]
      responses:
        '200':
          description: Midtrans Snap checkout payload
          content:
            application/json:
              schema:
                type: object
                required: [success, data, payment, flow]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      invoiceNumber: { type: string, nullable: true }
                      issueDate: { type: string, nullable: true }
                      dueDate: { type: string, nullable: true }
                      amountDue: { type: number }
                      isPaid: { type: boolean }
                      status: { type: string }
                  payment:
                    type: object
                    properties:
                      id: { type: integer }
                      uuid: { type: string, format: uuid }
                      gateway: { type: string, enum: [midtrans, mock] }
                      gatewayReference: { type: string, nullable: true }
                      paymentMethod: { type: string }
                      status: { type: string, enum: [pending, completed, failed] }
                      amount: { type: number }
                  flow:
                    type: object
                    properties:
                      mode: { type: string, enum: [hosted] }
                      provider: { type: string, enum: [midtrans, mock] }
                      snapToken: { type: string, nullable: true, description: "Midtrans Snap token for window.snap.pay()" }
                      hostedCheckoutUrl: { type: string, format: uri }
                      finishRedirectUrl: { type: string, format: uri }
                      unfinishRedirectUrl: { type: string, format: uri }
                      errorRedirectUrl: { type: string, format: uri }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Midtrans service error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [MIDTRANS_INIT_FAILED, MIDTRANS_CREATE_FAILED, GATEWAY_NOT_CONFIGURED] }
                      message: { type: string }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /webhooks/midtrans:
    post:
      tags: [Webhooks, Billing]
      summary: Receive Midtrans payment notification
      description: |
        Public endpoint for Midtrans server-to-server payment notifications.
        Secured by signature key validation (SHA-512). Updates payment and invoice status on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: string }
                transaction_status: { type: string }
                fraud_status: { type: string }
                gross_amount: { type: string }
                transaction_id: { type: string }
                signature_key: { type: string }
      responses:
        '200':
          description: Notification processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '400':
          description: Invalid signature or malformed payload

