components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumToken
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 100
    DepartmentId:
      name: departmentId
      in: query
      schema:
        type: integer
        minimum: 1
    DesignationId:
      name: designationId
      in: query
      schema:
        type: integer
        minimum: 1
    EmploymentStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [active, inactive, probation, resigned, terminated]
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, confirmPassword]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          pattern: "^[A-Za-z][A-Za-z\\s'.-]{1,149}$"
        email:
          type: string
          format: email
          pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
        password:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d)[A-Za-z\\d@$!%*?&._-]{8,64}$"
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 64
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64
        rememberMe:
          type: boolean
          nullable: true
        companyCode:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]+$"
          nullable: true
    DepartmentUpsertRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 50
          pattern: "^[A-Z][A-Z0-9_]{1,49}$"
        name:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
          maxLength: 1000
    DesignationUpsertRequest:
      allOf:
        - $ref: '#/components/schemas/DepartmentUpsertRequest'
    EmployeeDirectoryRow:
      type: object
      properties:
        id: { type: integer }
        employeeNo: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: 'Profil employee; kosong direpresentasikan sebagai "—"' }
        team: { type: string }
        departmentId: { type: integer, nullable: true }
        departmentName: { type: string }
        designationId: { type: integer, nullable: true }
        designationName: { type: string, nullable: true }
        designation: { type: string, description: 'Label tampilan; prioritas nama master designation jika ada' }
        employeeType: { type: string, nullable: true, example: contract }
        baseSalary: { type: number }
        fixedAllowance: { type: number }
        employmentStatus:
          type: string
          enum: [active, inactive, probation, resigned, terminated]
        hireDate:
          type: string
          format: date
          nullable: true
          description: Tanggal bergabung di profil (nullable)
        joinDate:
          type: string
          format: date
          description: startDate / hireDate jika ada, selain itu tanggal created_at user
        contractType:
          type: string
          enum: [pkwt, pkwtt]
          nullable: true
        contractStartDate: { type: string, format: date, nullable: true }
        contractEndDate: { type: string, format: date, nullable: true }
        pkwtDueThisMonth: { type: boolean }
        estimatedPkwtCompensationThisMonth: { type: number }
    EmployeeCreateRequest:
      type: object
      required: [name, email, password, confirmPassword, departmentId, designationId, employeeType, baseSalary, salaryType, contractType, contractStatus, contractStartDate, nik, phone, provinceId, regencyId, districtId, villageId, placeOfBirth, dateOfBirth, gender, maritalStatus, religion, bankName, bankAccountNo, bankAccountHolderName, emergencyContacts]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 64
        team:
          type: string
          maxLength: 100
          nullable: true
        departmentId:
          type: integer
          minimum: 1
          nullable: true
        designationId:
          type: integer
          minimum: 1
          nullable: true
        designation:
          type: string
          maxLength: 150
          nullable: true
        managerUserId:
          type: integer
          minimum: 1
          nullable: true
        employeeType:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        probationEndDate:
          type: string
          format: date
          nullable: true
        employmentStatus:
          type: string
          enum: [active, inactive, probation, resigned, terminated]
          nullable: true
        baseSalary:
          type: number
          format: float
          nullable: true
        fixedAllowance:
          type: number
          format: float
          nullable: true
        salaryType:
          type: string
          enum: [monthly, daily, hourly]
          nullable: true
        contractType:
          type: string
          enum: [pkwt, pkwtt, permanent]
          nullable: true
        contractStatus:
          type: string
          enum: [active, ended, terminated]
          nullable: true
        contractStartDate:
          type: string
          format: date
          nullable: true
        contractEndDate:
          type: string
          format: date
          nullable: true
          description: Required only when `contractType = pkwt`; must be omitted/empty for `pkwtt`.
        nik:
          type: string
          maxLength: 16
          pattern: '^[0-9]{16}$'
          nullable: true
          description: Required Indonesian NIK / KTP number, exactly 16 digits.
        ktpNo:
          type: string
          maxLength: 16
          pattern: '^[0-9]{16}$'
          nullable: true
          description: Alias of nik for frontend compatibility
        phone:
          type: string
          maxLength: 13
          pattern: '^[0-9]{10,13}$'
          nullable: true
          description: Required phone number, numeric only, 10–13 digits.
        provinceId:
          type: integer
          minimum: 1
          nullable: true
          description: Required for create; selected province id from wilayah hierarchy.
        regencyId:
          type: integer
          minimum: 1
          nullable: true
          description: Required for create; must belong to selected province.
        districtId:
          type: integer
          minimum: 1
          nullable: true
          description: Required for create; must belong to selected regency.
        villageId:
          type: integer
          minimum: 1
          nullable: true
          description: Required for create; must belong to selected district.
        address:
          type: string
          maxLength: 2000
          nullable: true
          description: Auto-composed from wilayah hierarchy when complete region ids are provided.
        addressDetail:
          type: string
