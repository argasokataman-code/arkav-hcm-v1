                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      periodYear:
                        type: integer
                        example: 2026
                      periodMonth:
                        type: integer
                        example: 4
                      status:
                        type: string
                        enum: [open, posted]
                        example: open
                      companyId:
                        type: integer
                        nullable: true
                        example: 12
                      companyName:
                        type: string
                        nullable: true
                        example: ARCAV Demo Tenant
                      companyCode:
                        type: string
                        nullable: true
                        example: DEMO01
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      latestRun:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                            example: 5
