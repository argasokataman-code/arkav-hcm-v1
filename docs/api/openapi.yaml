    get:
      tags: [SaaS]
      summary: List purchase transactions (HCM admin)
      description: |
        Bearer-token API consumers receive the purchase transaction payload documented here.
        The active SaaS admin page currently consumes a legacy ledger shape on the same path via API-token cookie auth.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [draft, issued, sent, paid, overdue, cancelled] }
        - name: company_id
          in: query
          required: false
          schema: { type: string }
          description: Company identifier supporting UUID-first input with numeric legacy fallback.
        - name: transaction_type
          in: query
          required: false
          schema: { type: string, enum: [subscription, addon, refund, credit, manual] }
        - name: from_date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to_date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        transactionCode: { type: string }
                        companyId: { type: integer }
                        company:
                          type: object
                          nullable: true
                          properties:
                            id: { type: integer }
                            code: { type: string, nullable: true }
                            name: { type: string, nullable: true }
                        subscriptionId: { type: integer, nullable: true }
                        subscription:
                          type: object
                          nullable: true
                          properties:
                            id: { type: integer }
                            planCode: { type: string, nullable: true }
                            status: { type: string, nullable: true }
                        packageAddonId: { type: integer, nullable: true }
                        packageAddon:
                          type: object
                          nullable: true
                          properties:
                            id: { type: integer }
                            code: { type: string, nullable: true }
                            name: { type: string, nullable: true }
                        transactionType: { type: string }
                        description: { type: string, nullable: true }
                        amount: { type: number }
                        taxAmount: { type: number }
                        discountAmount: { type: number }
                        totalAmount: { type: number }
                        billingPeriodStart: { type: string, format: date, nullable: true }
                        billingPeriodEnd: { type: string, format: date, nullable: true }
                        dueDate: { type: string, format: date-time, nullable: true }
                        paidAt: { type: string, format: date-time, nullable: true }
                        paymentMethod: { type: string, nullable: true }
                        paymentReference: { type: string, nullable: true }
                        status: { type: string }
                        isPaid: { type: boolean }
                        isOverdue: { type: boolean }
                        notes: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      per_page: { type: integer }
                      current_page: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [SaaS]
      summary: Create purchase transaction (HCM admin)
      description: |
        Bearer-token API consumers create purchase transactions through this contract.
        External identifiers are UUID-based; internal persistence still resolves to integer foreign keys.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, transaction_type, amount, status]
              properties:
                company_id: { type: string, format: uuid }
                subscription_id: { type: string, format: uuid, nullable: true }
                package_addon_id: { type: string, format: uuid, nullable: true }
                transaction_type: { type: string, enum: [subscription, addon, refund, credit, manual] }
                description: { type: string, nullable: true }
                amount: { type: number, minimum: 0 }
                tax_amount: { type: number, minimum: 0, nullable: true }
                discount_amount: { type: number, minimum: 0, nullable: true }
                status: { type: string, enum: [draft, issued, sent, paid, overdue, cancelled] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      transactionCode: { type: string }
                      companyId: { type: integer }
                      subscriptionId: { type: integer, nullable: true }
                      transactionType: { type: string }
                      amount: { type: number }
                      taxAmount: { type: number }
                      discountAmount: { type: number }
                      totalAmount: { type: number }
                      status: { type: string }
                      isPaid: { type: boolean }
                      isOverdue: { type: boolean }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

