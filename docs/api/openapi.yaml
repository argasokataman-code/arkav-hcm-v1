      summary: Sync Indonesia holidays (admin only)
      description: Reconciles API holidays for selected year using libur.deno.dev as primary provider and date.nager.at as automatic fallback, keeps manual holidays, and refreshes linkage to `holiday_calendars` for leave calculations.
