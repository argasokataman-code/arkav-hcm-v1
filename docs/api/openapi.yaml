      description: |
        Mengembalikan daftar karyawan PKWT yang `contract_end_date` jatuh pada bulan yang dipilih,
        berikut estimasi kompensasi proporsional berdasarkan upah bulanan dan masa kerja kontrak.
        Respons juga menyertakan status payroll run PKWT aktif untuk periode yang sama jika sudah pernah diposting.
      security:
        - bearerAuth: []
      parameters:
        - name: periodYear
          in: query
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - name: periodMonth
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
