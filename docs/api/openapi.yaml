                            type: integer
                          periodMonth:
                            type: integer
                          status:
                            type: string
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422':
          description: Validation/domain error termasuk PAYROLL_RUN_NOT_FINALIZED dan PAYROLL_RUN_ALREADY_PAID
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
