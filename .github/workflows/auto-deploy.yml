name: Deploy Arkav HCM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest

  deploy-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
            docker pull ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest
            docker rm -f arkav-hcm || true
            docker run -d --name arkav-hcm --restart always -p 8007:8007 -p 5179:5179 -v /data/code/.env:/app/backend/.env ghcr.io/${{ github.repository_owner }}/arkav-hcm:latest
            docker exec arkav-hcm bash -c "cd /app/backend && php artisan key:generate && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate"
            docker rmi $(docker images -q) || true
          EOF
