  # -------------------------
  # Payroll — salary component master (implemented under /v1/hcm)
  # -------------------------
  /v1/hcm/salary-components:
    get:
      tags: [Payroll]
      summary: List salary components (HCM admin only)
      description: |
        Mengembalikan semua baris master komponen gaji (urut `sortOrder`, `name`).
        Hanya **HCM Admin**; non-admin `403`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentListResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Payroll]
      summary: Create salary component (disabled for tenant)
      description: |
        Pembuatan komponen manual pada tenant dinonaktifkan. Endpoint ini selalu
        mengembalikan `403` dengan `error.code = MANUAL_COMPONENT_CREATION_DISABLED`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryComponentCreateRequest'
      responses:
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403':
          description: Manual creation disabled for tenant runtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hcm/salary-components/employee-profiles:
    get:
      tags: [Payroll]
      summary: List employee integration profiles for salary component audit (HCM admin only)
      description: |
        Snapshot employee-level integrasi salary component/payroll item assignment untuk audit.
        Mengembalikan identitas karyawan, gap identitas, ringkasan assignment aktif,
        dan status integrasi (`ready|partial|missing`).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          required: false
        - in: query
          name: perPage
          schema:
            type: integer
            minimum: 1
            maximum: 500
          required: false
        - in: query
          name: search
          schema:
            type: string
            maxLength: 120
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentEmployeeProfileListResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/hcm/salary-components/{id}:
    get:
      tags: [Payroll]
      summary: Get salary component by id (HCM admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentDetailResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      tags: [Payroll]
      summary: Update salary component (HCM admin)
      description: |
        Semua baris menggunakan payload penuh (`SalaryComponentUpdateFullRequest`).
        Jika komponen `isSystemLocked = true`, runtime menolak mutasi langsung dengan `403` + `SYSTEM_LOCKED`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryComponentUpdateFullRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentOkResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403':
          description: Forbidden or component locked by governance module
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Payroll]
      summary: Delete salary component (HCM admin)
      description: |
        Hanya komponen custom tenant (`isSystemLocked = false`) yang dapat dihapus permanen.
        Komponen governance/system yang locked mengembalikan `403` + `SYSTEM_LOCKED`.
        Relasi downstream seperti payroll items, overtime requests, dan payroll lines akan terlepas otomatis
        melalui foreign key `nullOnDelete` hanya untuk komponen custom yang memang boleh dihapus.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryComponentOkResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403':
          description: Forbidden or component locked by governance module
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/hcm/salary-components/{id}/tax-flags:
    patch:
