      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /v1/hcm/billing/invoices/{id}/mock-pay:
    post:
      tags: [SaaS, HCM]
      summary: Mark invoice paid using mock gateway and create payment audit record
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InvoiceNumericIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentMethod:
                  type: string
                  enum: [mock_card, mock_bank, mock_ewallet]
                gateway:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: Invoice paid (or already paid)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      invoiceNumber: { type: string, nullable: true }
                      issueDate: { type: string, nullable: true }
                      dueDate: { type: string, nullable: true }
                      amountDue: { type: number }
                      isPaid: { type: boolean }
                      status: { type: string }
                  payment:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      gateway: { type: string }
                      gatewayReference: { type: string, nullable: true }
                      paymentMethod: { type: string }
                      status: { type: string }
                      amount: { type: number }
                      paidAt: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /v1/hcm/billing/invoices/{id}/mock-hosted-checkout:
    post:
      tags: [SaaS, HCM]
      summary: Create or reuse a hosted mock checkout URL for a tenant invoice
      description: Development-only hosted payment helper for pending tenant invoices. Reuses the latest pending mock payment when available.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InvoiceNumericIdPath'
      responses:
        '200':
          description: Hosted mock checkout payload
          content:
            application/json:
              schema:
                type: object
                required: [success, data, payment, flow]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      invoiceNumber: { type: string, nullable: true }
                      issueDate: { type: string, nullable: true }
                      dueDate: { type: string, nullable: true }
                      amountDue: { type: number }
                      isPaid: { type: boolean }
                      status: { type: string }
                  payment:
                    type: object
                    properties:
                      id: { type: integer }
                      uuid: { type: string, format: uuid }
                      gateway: { type: string }
                      gatewayReference: { type: string, nullable: true }
                      paymentMethod: { type: string }
                      status: { type: string, enum: [pending, completed, failed] }
                      amount: { type: number }
                  flow:
                    type: object
                    properties:
                      mode: { type: string, enum: [hosted] }
                      hostedCheckoutUrl: { type: string, format: uri }
                      callbackToken: { type: string }
                      successRedirectUrl: { type: string, format: uri }
                      failureRedirectUrl: { type: string, format: uri }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /v1/mock/payments/create:
    post:
      tags: [Development, Billing]
      summary: Create a mock payment for an existing invoice
      description: Development-only helper endpoint. Requires active tenant context and an invoice UUID.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id, amount]
              properties:
                invoice_id:
                  type: string
                  format: uuid
                amount:
                  type: number
                  minimum: 0.01
                payment_method:
                  type: string
                  enum: [mock_card, mock_bank, mock_ewallet]
                simulate_failure:
                  type: boolean
      responses:
        '201':
          description: Mock payment completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      payment:
                        type: object
                        properties:
                          id: { type: integer }
                          uuid: { type: string, format: uuid }
                          gateway_reference: { type: string }
                          status: { type: string }
                          amount: { type: number }
                          paid_at: { type: string, format: date-time, nullable: true }
                      invoice:
                        type: object
                        properties:
                          id: { type: integer }
                          uuid: { type: string, format: uuid }
                          status: { type: string }
                          paid_at: { type: string, format: date-time, nullable: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/mock/invoices/create-and-pay:
    post:
      tags: [Development, Billing]
      summary: Create an invoice and pay it immediately via mock gateway
      description: Development-only shortcut endpoint for billing smoke tests. Supports instant shortcut mode and hosted local simulation mode.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  minimum: 0.01
                description:
                  type: string
                  maxLength: 255
                  nullable: true
                currency:
                  type: string
                  enum: [IDR, USD]
                simulate_failure:
                  type: boolean
                flow_mode:
                  type: string
                  enum: [instant, hosted]
                success_url:
                  type: string
                  format: uri
                  nullable: true
                failure_url:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '201':
          description: Mock invoice and payment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      invoice:
                        type: object
                        properties:
                          id: { type: integer }
                          uuid: { type: string, format: uuid }
                          number: { type: string }
                          amount: { type: number }
                          status: { type: string }
                      payment:
                        type: object
                        properties:
                          id: { type: integer }
                          uuid: { type: string, format: uuid }
                          gateway_reference: { type: string }
                          status: { type: string }
                          amount: { type: number }
                          callback_token: { type: string, nullable: true }
                          hosted_checkout_url: { type: string, format: uri, nullable: true }
                      subscription:
                        type: object
                        nullable: true
                        properties:
                          id: { type: integer }
                          status: { type: string }
                          activated: { type: boolean }
                      flow:
                        type: object
                        properties:
                          mode: { type: string }
                          hosted_checkout_url: { type: string, format: uri, nullable: true }
                          success_redirect_url: { type: string, format: uri, nullable: true }
                          failure_redirect_url: { type: string, format: uri, nullable: true }
                          callback_token: { type: string, nullable: true }
                          webhook:
                            type: object
                            properties:
                              simulate_success_url: { type: string, format: uri }
                              requires_callback_token: { type: boolean }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/mock/test-cards:
    get:
      tags: [Development, Billing]
      summary: Get mock payment test card presets
      description: Development-only helper endpoint for manual testing.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Test cards list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        number: { type: string }
                        name: { type: string }
                        result: { type: string }
                        description: { type: string }
