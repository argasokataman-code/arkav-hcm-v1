          in: query
          required: true
          schema: { type: string, enum: [trial, subscribed] }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        company:
                          type: object
                          properties:
                            id: { type: integer }
                            code: { type: string }
                            name: { type: string }
                        subscription:
                          type: object
                          properties:
                            id: { type: integer }
                            status: { type: string }
                            billingCycle: { type: string }
                            startsAt: { type: string, format: date-time }
                            endsAt: { type: string, format: date-time }
                            trialEndsAt: { type: string, format: date-time, nullable: true }
                            planCode: { type: string }
                            packageId: { type: string, format: uuid, nullable: true }
                            packageName: { type: string }
                            amount: { type: number, nullable: true }
                            cancellationReason:
                              type: string
                              nullable: true
                              enum: [trial_expired, payment_overdue, tenant_request, system_webhook, manual_stop, seeded_demo_state, unknown]
                            cancellationDescription: { type: string, nullable: true }
                            cancelledAt: { type: string, format: date-time, nullable: true }
                        latestInvoice:
                          type: object
                          nullable: true
                          properties:
                            id: { type: integer }
                            uuid: { type: string, format: uuid }
                            invoiceNumber: { type: string, nullable: true }
                            issueDate: { type: string, format: date, nullable: true }
                            dueDate: { type: string, format: date, nullable: true }
                            amountDue: { type: number }
                            isPaid: { type: boolean }
                            status: { type: string }
                            detailUrl: { type: string, format: uri, nullable: true }
                        email:
                          type: object
                          properties:
                            status: { type: string, enum: [no_invoice, not_sent, sent, failed] }
                            sentAt: { type: string, format: date-time, nullable: true }
                            lastError: { type: string, nullable: true }
                        stateBadges:
                          type: array
                          items:
                            type: object
                            properties:
                              code: { type: string }
                              label: { type: string }
                              kind: { type: string, enum: [warning, danger, info, success, secondary] }
                              message: { type: string }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      per_page: { type: integer }
                      current_page: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/saas/renewal-monitoring/summary:
    get:
      tags: [SaaS]
      summary: Renewal monitoring summary for global super admin
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      windowDays: { type: integer }
                      summary:
                        type: object
                        properties:
